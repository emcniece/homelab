[proxmox]
# The 3 Proxmox hosts for the Ceph/ZFS cluster.
# pve1 is the same physical host as [hp] above (192.168.10.3) — it's listed
# here too so provision-scrutiny.yml can target all 3 with one run. The two
# groups otherwise stay independent (hp/provision.yml still owns its own
# tags/vars for that host).
