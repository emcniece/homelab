---
# VM that receives the GPU. See infra/amd-gpu-device-plugin/README.md.
pve_gpu_vmid: 117

# Kernel cmdline. initcall_blacklist=sysfb_init stops the host's simpledrm
# framebuffer from holding the GPU's BAR0 (QEMU "Failed to mmap ... BAR 0",
# guest amdgpu "PSP: Failed to load toc").
pve_gpu_grub_cmdline: quiet iommu=pt initcall_blacklist=sysfb_init

# VBIOS dumped while the host amdgpu still owned the GPU. It can't be
# regenerated by this role (vfio-pci owns the GPU at boot), so it is only
# checked. Re-dump procedure: roles/pve-gpu-passthrough/README.md.
pve_gpu_romfile: strixhalo-vbios.rom
pve_gpu_romfile_sha256: dcd3b53a262ed95fa71044495f2a9b15fa21fa92b7663eba0cb8836127446cb8

# `qm config` lines the VM must have. Applied with `qm set` when they
# differ; hostpci/machine/bios changes take effect at the next VM start.
pve_gpu_vm_config:
  machine: q35
  bios: ovmf
  hostpci0: 0000:c2:00.0,pcie=1,romfile=strixhalo-vbios.rom
  hostpci1: 0000:c2:00.1,pcie=1
  balloon: 0          # passthrough pins all guest RAM
  memory: 114688      # 112 GiB; Ollama's GTT budget assumes this (apps/ollama/README.md)
