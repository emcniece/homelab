---
# This role is shared across playbooks with different gather_facts
# settings (beelink/hp run with gather_facts: no). Gather just what we
# need rather than depending on the caller.
- name: Gather device facts if not already present
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - devices
  when: ansible_devices is not defined

- name: Detect physical disks (sd*, vd*, nvme*, hd*) from gathered facts
  set_fact:
    scrutiny_disks: >-
      {{ ansible_devices.keys()
         | select('match', '^(sd|vd|nvme|hd)[a-z0-9]+$')
         | sort
         | list }}

- name: Fail if no physical disks were detected
  fail:
    msg: >-
      No physical disks detected via ansible_devices on {{ inventory_hostname }}.
      This role requires gather_facts: yes — check the playbook and re-run.
  when: scrutiny_disks | length == 0

- name: Report detected disks
  debug:
    msg: "{{ inventory_hostname }}: collector will watch {{ scrutiny_disks | join(', ') }}"

- name: Ensure apps directory exists
  file:
    path: '/home/{{ runtime_user }}/apps/scrutiny-collector'
    state: directory
    owner: '{{ runtime_user }}'
    mode: '0755'

- name: Template docker-compose to ~/apps/scrutiny-collector/
  template:
    src: ../files/docker-compose.yml.j2
    dest: '/home/{{ runtime_user }}/apps/scrutiny-collector/docker-compose.yml'
    mode: '0644'

- name: Template collector.yaml to ~/apps/scrutiny-collector/
  template:
    src: ../files/collector.yaml.j2
    dest: '/home/{{ runtime_user }}/apps/scrutiny-collector/collector.yaml'
    mode: '0644'

- name: Pull latest collector image
  command:
    cmd: docker compose pull
    chdir: '/home/{{ runtime_user }}/apps/scrutiny-collector'
  changed_when: false

- name: Create and start scrutiny-collector
  command:
    cmd: docker compose up -d --remove-orphans
    chdir: '/home/{{ runtime_user }}/apps/scrutiny-collector'
  register: output
  changed_when: >-
    'Started' in (output.stdout + output.stderr)
    or 'Created' in (output.stdout + output.stderr)
    or 'Recreate' in (output.stdout + output.stderr)
