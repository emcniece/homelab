apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  namespace: outline
  labels:
    app: outline
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outline
  template:
    metadata:
      labels:
        app: outline
    spec:
      initContainers:
        # Block until Postgres accepts connections.
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secret
          command:
            - /bin/sh
            - -c
            - 'until pg_isready -h postgres -U "$POSTGRES_USER"; do echo waiting for postgres; sleep 2; done'
        # Run database migrations before the app starts.
        - name: migrate
          image: outlinewiki/outline:latest
          imagePullPolicy: IfNotPresent
          command: ["yarn", "db:migrate"]
          env:
            - name: NODE_ENV
              value: production
            - name: PGSSLMODE
              value: disable
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-secret
                  key: SECRET_KEY
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-secret
                  key: UTILS_SECRET
      containers:
        - name: outline
          image: outlinewiki/outline:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            # SECRET_KEY, UTILS_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
            - secretRef:
                name: outline-secret
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
            # AWS_S3_UPLOAD_BUCKET_URL, AWS_S3_UPLOAD_BUCKET_NAME  (Backblaze B2)
            - secretRef:
                name: s3-secret
          env:
            - name: NODE_ENV
              value: production
            - name: URL
              value: https://docs.emc2.build
            - name: PORT
              value: "3000"
            - name: FORCE_HTTPS
              value: "true"
            - name: ENABLE_UPDATES
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: DEFAULT_LANGUAGE
              value: en_US
            - name: RATE_LIMITER_ENABLED
              value: "false"
            # --- database ---
            - name: PGSSLMODE
              value: disable
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            # --- redis ---
            - name: REDIS_URL
              value: redis://redis:6379
            # --- file storage (Backblaze B2, S3-compatible API) ---
            # Credentials + bucket/region/endpoint come from s3-secret above.
            - name: FILE_STORAGE
              value: s3
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_S3_ACL
              value: private
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /_health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: outline
  namespace: outline
  labels:
    app: outline
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: outline
