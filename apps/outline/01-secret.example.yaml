# Copy this file to 01-secret.yaml and fill in real values, then:
#   kubectl apply -f apps/outline/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public). Keep the real values
# out of git. Generate the random ones with:
#   openssl rand -hex 32   # SECRET_KEY, UTILS_SECRET
#   openssl rand -hex 20   # passwords / S3 keys
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: outline
type: Opaque
stringData:
  POSTGRES_USER: outline
  POSTGRES_PASSWORD: REPLACE_WITH_openssl_rand_hex_20
  POSTGRES_DB: outline
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: outline
type: Opaque
stringData:
  # MinIO root account (admin)
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: REPLACE_WITH_openssl_rand_hex_20
  # Scoped key that Outline uses to read/write the "outline" bucket.
  # Created by the 31-minio-bucket-job.
  OUTLINE_S3_ACCESS_KEY: outline
  OUTLINE_S3_SECRET_KEY: REPLACE_WITH_openssl_rand_hex_20
---
apiVersion: v1
kind: Secret
metadata:
  name: outline-secret
  namespace: outline
type: Opaque
stringData:
  # openssl rand -hex 32
  SECRET_KEY: REPLACE_WITH_openssl_rand_hex_32
  # openssl rand -hex 32
  UTILS_SECRET: REPLACE_WITH_openssl_rand_hex_32
  # Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID
  # Application type: Web application
  # Authorized redirect URI: https://docs.emc2.build/auth/google.callback
  GOOGLE_CLIENT_ID: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID
  GOOGLE_CLIENT_SECRET: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_SECRET
