# Copy this file to 01-secret.yaml and fill in real values, then:
#   kubectl apply -f apps/outline/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public). Keep the real values
# out of git. Generate the random ones with:
#   openssl rand -hex 32   # SECRET_KEY, UTILS_SECRET
#   openssl rand -hex 20   # POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: outline
type: Opaque
stringData:
  POSTGRES_USER: outline
  POSTGRES_PASSWORD: REPLACE_WITH_openssl_rand_hex_20
  POSTGRES_DB: outline
---
apiVersion: v1
kind: Secret
metadata:
  name: outline-secret
  namespace: outline
type: Opaque
stringData:
  # openssl rand -hex 32
  SECRET_KEY: REPLACE_WITH_openssl_rand_hex_32
  # openssl rand -hex 32
  UTILS_SECRET: REPLACE_WITH_openssl_rand_hex_32
  # Google OAuth client, wired via Outline's generic OIDC plugin (the dedicated
  # Google plugin rejects personal @gmail.com accounts on team creation).
  # Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID
  # Application type: Web application
  # Authorized redirect URI: https://docs.emc2.build/auth/oidc.callback
  OIDC_CLIENT_ID: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID
  OIDC_CLIENT_SECRET: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  namespace: outline
type: Opaque
stringData:
  # Backblaze B2 -> Application Keys -> Add a New Application Key
  # Scope the key to the single bucket; needs read+write.
  AWS_ACCESS_KEY_ID: REPLACE_WITH_B2_KEY_ID
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_B2_APPLICATION_KEY
  # From the bucket's Endpoint, e.g. s3.us-west-004.backblazeb2.com
  AWS_REGION: us-west-004
  AWS_S3_UPLOAD_BUCKET_URL: https://s3.us-west-004.backblazeb2.com
  AWS_S3_UPLOAD_BUCKET_NAME: REPLACE_WITH_B2_BUCKET_NAME
