# Creates the "outline" bucket and a scoped access key for Outline.
# Idempotent - safe to re-run (delete the Job first to re-apply):
#   kubectl -n outline delete job minio-bucket-setup
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-setup
  namespace: outline
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: minio-bucket-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-secret
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO..."
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                sleep 3
              done
              echo "Creating bucket 'outline'..."
              mc mb --ignore-existing local/outline
              echo "Creating scoped user for Outline..."
              mc admin user add local "$OUTLINE_S3_ACCESS_KEY" "$OUTLINE_S3_SECRET_KEY" || true
              mc admin policy attach local readwrite --user "$OUTLINE_S3_ACCESS_KEY" || true
              echo "Done."
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
