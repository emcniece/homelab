# Outline generates presigned S3 URLs that the browser uploads to / downloads
# from directly, so the MinIO S3 API (:9000) must be reachable publicly.
# The MinIO console (:9001) is NOT exposed - use port-forward for admin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-s3
  namespace: outline
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-http-to-https-redirect@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - s3.emc2.build
      secretName: s3-emc2-build-letsencrypt-tls
  rules:
    - host: s3.emc2.build
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
