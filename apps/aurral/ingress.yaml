# LAN: the full app. Aurral holds the Lidarr, Navidrome and slskd credentials
# and can trigger downloads, so the web UI is never published; only the
# Subsonic API is public, via public.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurral
  namespace: media
  labels:
    app: aurral
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-http-to-https-redirect-media@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - aurral.lab.emc2.build
    secretName: aurral-letsencrypt-tls
  rules:
  - host: aurral.lab.emc2.build
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aurral
            port:
              name: http
