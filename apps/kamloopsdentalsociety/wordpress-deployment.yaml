---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: kdds
  annotations:
    traefik.enable: 'true'
    traefik.frontend.rule: Host:kamloopsdentalsociety.ca
    traefik.port: '80'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          # images/wordpress: official image + phpredis.
          image: ghcr.io/emcniece/wordpress:php8.5-apache
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - containerPort: 80
              name: wordpress
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: php-overrides
              mountPath: /usr/local/etc/php/conf.d/zz-overrides.ini
              subPath: zz-overrides.ini
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql-service
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: WORDPRESS_DB_USER
              value: root
            - name: WORDPRESS_DB_NAME
              value: wordpress
            # wp-config.php evals this (official-image wp-config). WP-Cron
            # runs from the wordpress-cron CronJob instead of on page loads.
            - name: WORDPRESS_CONFIG_EXTRA
              value: define('DISABLE_WP_CRON', true);
            - name: WP_REDIS_HOST
              value: localhost 
            - name: WP_REDIS_PORT
              value: "6379"
        - name: redis
          image: redis:7-alpine
          # Pure cache: no persistence, and evict instead of erroring when
          # full (stays under the container memory limit).
          args:
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 6379
              name: redis    
      # Every page render makes hundreds of DB round-trips; cross-node (and
      # onto a busy node) they measured 2-3ms each vs 0.7ms co-located.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: mysql
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          # glyphdex-ollama runs CPU inference pinned at its 6-core limit; keep
          # latency-sensitive pods off its node.
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: glyphdex
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: glyphdex
                  app.kubernetes.io/component: ollama
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - name: ndots
            value: "2"
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: kdds-wp
        - name: php-overrides
          configMap:
            name: wordpress-php-overrides
---
kind: Service
apiVersion: v1
metadata:
  name: wordpress-service
  namespace: kdds
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-http-to-https-redirect@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  creationTimestamp: null
  name: kamloopsdentalsociety
  namespace: kdds
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - kamloopsdentalsociety.com
    secretName: kamloopsdentalsociety-tls
  rules:
  - host: kamloopsdentalsociety.com
    http:
      paths:
      - backend:
          service:
            name: wordpress-service
            port:
              number: 80
        path: /
        pathType: Prefix
