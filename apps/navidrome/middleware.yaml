# Middlewares for the public music.emc2.build router only.
#
# music.emc2.build is proxied through Cloudflare, but the zone also has a
# DNS-only `*.emc2.build` CNAME that hands out the home IP for any name, so
# the origin is reachable directly. Two consequences:
#   1. Only accept connections from Cloudflare's edge (navidrome-cloudflare-only).
#      Traefik's LB uses externalTrafficPolicy: Local, so the peer address
#      Traefik sees is the real connecting IP.
#   2. With (1) in place, CF-Connecting-IP can't be spoofed, so it's safe to
#      key the rate limit on it (navidrome-ratelimit).
#
# Cloudflare ranges from https://www.cloudflare.com/ips/ (API etag
# 38f79d050aa027e3be3865e495dcc9bc, fetched 2026-11-07). They change rarely;
# re-check if public access starts failing with 403s.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-cloudflare-only
  namespace: media
  labels:
    app: navidrome
spec:
  ipAllowList:
    sourceRange:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
---
# Per-client limit. Symfonium bursts (library sync, cover art) so this is
# generous; it's there to blunt credential stuffing on /rest, not throttle use.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-ratelimit
  namespace: media
  labels:
    app: navidrome
spec:
  rateLimit:
    average: 20
    burst: 100
    period: 1s
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
