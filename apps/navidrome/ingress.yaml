# LAN: the full app (web UI, admin) on navidrome.lab.emc2.build.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-lab
  namespace: media
  labels:
    app: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-http-to-https-redirect-media@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - navidrome.lab.emc2.build
    secretName: navidrome-lab-letsencrypt-tls
  rules:
  - host: navidrome.lab.emc2.build
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: navidrome
            port:
              name: http
---
# Public: Subsonic API (/rest, all Symfonium needs) and share links (/share)
# only, through Cloudflare. The web UI and admin stay LAN-only. Anything else
# on this host 404s at Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-public
  namespace: media
  labels:
    app: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-navidrome-cloudflare-only@kubernetescrd,media-navidrome-ratelimit@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - music.emc2.build
    secretName: navidrome-public-letsencrypt-tls
  rules:
  - host: music.emc2.build
    http:
      paths:
      - path: /rest
        pathType: Prefix
        backend:
          service:
            name: navidrome
            port:
              name: http
      - path: /share
        pathType: Prefix
        backend:
          service:
            name: navidrome
            port:
              name: http
