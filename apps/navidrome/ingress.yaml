# LAN only: the full app (web UI, admin) on navidrome.lab.emc2.build.
# music.emc2.build now points at Aurral (apps/aurral/public.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-lab
  namespace: media
  labels:
    app: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: media-http-to-https-redirect-media@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - navidrome.lab.emc2.build
    secretName: navidrome-lab-letsencrypt-tls
  rules:
  - host: navidrome.lab.emc2.build
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: navidrome
            port:
              name: http
