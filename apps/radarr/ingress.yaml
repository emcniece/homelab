apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  name: radarr
  namespace: media
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - radarr.lab.emc2.build
    secretName: radarr-letsencrypt-tls
  rules:
  - host: radarr.lab.emc2.build
    http:
      paths:
      - backend:
          service:
            name: radarr
            port:
              number: 7878
        path: /
        pathType: Prefix
