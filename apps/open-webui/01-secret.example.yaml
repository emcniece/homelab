# Copy this file to 01-secret.yaml and fill in real values, then:
#   kubectl apply -f apps/open-webui/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public).
#
# WEBUI_SECRET_KEY signs login sessions (JWTs). Changing it logs everyone out.
# OPEN_TERMINAL_API_KEY and CONTEXT7_API_KEY are substituted into the tool and
# terminal connection env vars in 10-open-webui.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secret
  namespace: open-webui
type: Opaque
stringData:
  # openssl rand -base64 32
  WEBUI_SECRET_KEY: REPLACE_WITH_openssl_rand_base64_32
  # Same value as apps/open-terminal/01-secret.yaml
  OPEN_TERMINAL_API_KEY: REPLACE_WITH_open_terminal_key
  # Free key from https://context7.com/dashboard (library docs MCP)
  CONTEXT7_API_KEY: REPLACE_WITH_ctx7sk_key
