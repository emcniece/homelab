apiVersion: v1
kind: ConfigMap
metadata:
  name: moneymaker-config
  namespace: moneymaker
data:
  # ── Claude models (per role) ───────────────────────────────────────
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_MODEL_REGIME: "claude-opus-4-7"
  CLAUDE_MODEL_REVIEW: ""        # empty → falls back to CLAUDE_MODEL
  CLAUDE_MODEL_SELECT: ""
  CLAUDE_MODEL_MANAGE: "claude-haiku-4-5"
  MANAGE_INTERVAL_MIN: "5"
  # Minimum unrealized P&L as a multiple of initial risk before Claude may
  # tighten the stop to break-even or better. 1.0 = price must have moved
  # a full 1R in our favor first. Set to "0" to disable.
  MANAGE_BREAKEVEN_MIN_R: "1.0"

  # ── MooMoo OpenAPI ─────────────────────────────────────────────────
  # OpenD runs in-cluster as a sibling Deployment (opend-deployment.yaml).
  # `opend` resolves to its ClusterIP Service. The OpenD.xml in the
  # `opend-config` Secret must set <ip>0.0.0.0</ip> so it binds on the
  # pod's interface (not just loopback).
  MOOMOO_HOST: "opend"
  MOOMOO_PORT: "11111"
  MOOMOO_TRADE_ENV: "SIMULATE"   # SIMULATE | REAL
  MOOMOO_TRADE_MARKET: "US"
  MOOMOO_ACCOUNT_INDEX: "0"
  # RSA key shared with the OpenD pod's <rsa_private_key>. MooMoo blocks
  # unencrypted trade calls whenever OpenD binds to a non-loopback address —
  # which is always the case in-cluster. Both pods mount the same key from
  # the `moneymaker-rsa-key` Secret. Leave blank to disable (quotes still
  # work, but account/trade calls fail).
  MOOMOO_RSA_KEY_PATH: "/etc/moneymaker/rsa_key.pem"

  # ── Risk parameters ────────────────────────────────────────────────
  RISK_PER_TRADE: "0.01"
  MAX_DAILY_LOSS: "0.03"
  MAX_OPEN_POSITIONS: "4"
  LOSS_COOLDOWN_MIN: "30"

  # Heuristic pre-review gate: rule-based rejections upstream of the Claude
  # review_signal call. Catches the patterns Claude was vetoing anyway,
  # cutting review tokens roughly in half on chop days. Tune thresholds
  # against the weekly tuner's `heuristic_rejection_counts` block.
  HEURISTIC_GATE_ENABLED: "true"
  HEURISTIC_MIN_REL_VOLUME: "0.5"
  HEURISTIC_CHOP_MIN_RR: "2.0"
  HEURISTIC_TREND_MIN_RR: "1.4"
  # MooMoo's SIMULATE account ships with $1M of cash — way too much given
  # the target real-account size. RISK_EQUITY_OVERRIDE makes the engine
  # size against this value instead, so paper trades run at the actual
  # scale we'll go live at. Set to 0 (or remove) to use the broker's
  # reported equity. Update this BEFORE flipping MOOMOO_TRADE_ENV=REAL.
  RISK_EQUITY_OVERRIDE: "1000"

  # Equity tiers — selected once at session open against the starting equity.
  # Each tier overrides the flat RISK_PER_TRADE / MAX_DAILY_LOSS /
  # MAX_OPEN_POSITIONS and the UNIVERSE_MAX_PRICE / UNIVERSE_MIN_AVG_VOLUME
  # for that session. As the account grows, the engine self-promotes to the
  # next tier — no manual ConfigMap edits as we move from cash → margin → scale.
  #   cash   (<$25k):    PDT-constrained, one position, sub-$50 liquid names,
  #                      3% risk per trade so single trades fit the budget.
  #   margin (<$100k):   PDT clears, full mid-cap universe, 2 concurrent.
  #   scale  ($100k+):   Risk % scales back down, 4 concurrent positions.
  EQUITY_TIERS_JSON: |
    [
      {"name":"cash",   "max_equity": 25000,  "risk_per_trade": 0.03,  "max_daily_loss": 0.05, "max_open_positions": 4, "max_price": 50,   "min_avg_volume": 5000000},
      {"name":"margin", "max_equity": 100000, "risk_per_trade": 0.015, "max_daily_loss": 0.04, "max_open_positions": 2, "max_price": 200,  "min_avg_volume": 2000000},
      {"name":"scale",  "max_equity": null,   "risk_per_trade": 0.01,  "max_daily_loss": 0.03, "max_open_positions": 4, "max_price": 1000, "min_avg_volume": 1000000}
    ]

  # ── Universes ──────────────────────────────────────────────────────
  # DYNAMIC_UNIVERSE=true makes the engine ignore the static lists below
  # and pull today's most-active tickers from MooMoo's get_stock_filter
  # at session open. Quality gates: price band + 10d cumulative volume
  # floor (UNIVERSE_MIN_AVG_VOLUME × 10 days). Falls back to the static
  # union on any failure path — the engine never runs without a list.
  # Local probe before flipping prod:
  #   python main.py universe --top 25 --min-avg-volume 5000000
  DYNAMIC_UNIVERSE: "true"
  UNIVERSE_TOP_N: "25"
  UNIVERSE_MIN_PRICE: "5"
  UNIVERSE_MAX_PRICE: "200"
  UNIVERSE_MIN_AVG_VOLUME: "5000000"   # 5M shares/day — drops marginals

  # Static fallback — used when DYNAMIC_UNIVERSE=false or any dynamic
  # path errors out (screener failure, OpenD reconnect mid-session, ...)
  # WATCHLIST       — breakout strategies (ORB, momentum)
  # WATCHLIST_FADE  — fade strategies (ORF) — chop-prone mid-caps only
  WATCHLIST: "SPY,QQQ,TSLA,NVDA,AMD,AAPL,MSFT,META,AMZN,GOOGL,COIN,MSTR,PLTR,SMCI,ARM"
  WATCHLIST_FADE: "RIVN,AFRM,HOOD,SOFI,U,LCID,DKNG,UPST,RBLX,CHWY"

  # ── Scheduler ──────────────────────────────────────────────────────
  DRY_RUN: "false"
  USE_CLAUDE: "true"
  TICK_SECONDS: "60"
  SESSION_MINUTES: "390"
  TZ: "America/New_York"

  # ── Observability ──────────────────────────────────────────────────
  METRICS_ENABLED: "true"
  METRICS_PORT: "9100"
  METRICS_ADDR: "0.0.0.0"
