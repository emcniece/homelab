apiVersion: v1
kind: ConfigMap
metadata:
  name: moneymaker-config
  namespace: moneymaker
data:
  # ── Claude models (per role) ───────────────────────────────────────
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_MODEL_REGIME: "claude-opus-4-7"
  CLAUDE_MODEL_REVIEW: ""        # empty → falls back to CLAUDE_MODEL
  CLAUDE_MODEL_SELECT: ""
  CLAUDE_MODEL_MANAGE: "claude-haiku-4-5"
  MANAGE_INTERVAL_MIN: "15"
  # Regime brief refresh cadence in minutes. Originally called once at
  # boot; 7/7 disaster (6-of-6 LONGs stopped after SPY reversed 0.77%
  # in the first hour) exposed that the boot-time regime state stayed
  # stale all session. 30 min catches morning reversals cheaply.
  REGIME_REFRESH_MIN: "30"
  # Minimum unrealized P&L as a multiple of initial risk before Claude may
  # tighten the stop to break-even or better. 1.0 = price must have moved
  # a full 1R in our favor first. Set to "0" to disable.
  MANAGE_BREAKEVEN_MIN_R: "1.0"

  # ── MooMoo OpenAPI ─────────────────────────────────────────────────
  # OpenD runs in-cluster as a sibling Deployment (opend-deployment.yaml).
  # `opend` resolves to its ClusterIP Service. The OpenD.xml in the
  # `opend-config` Secret must set <ip>0.0.0.0</ip> so it binds on the
  # pod's interface (not just loopback).
  MOOMOO_HOST: "opend"
  MOOMOO_PORT: "11111"
  MOOMOO_TRADE_ENV: "SIMULATE"   # SIMULATE | REAL
  MOOMOO_TRADE_MARKET: "US"
  MOOMOO_ACCOUNT_INDEX: "0"
  # RSA key shared with the OpenD pod's <rsa_private_key>. MooMoo blocks
  # unencrypted trade calls whenever OpenD binds to a non-loopback address —
  # which is always the case in-cluster. Both pods mount the same key from
  # the `moneymaker-rsa-key` Secret. Leave blank to disable (quotes still
  # work, but account/trade calls fail).
  MOOMOO_RSA_KEY_PATH: "/etc/moneymaker/rsa_key.pem"

  # ── Risk parameters ────────────────────────────────────────────────
  RISK_PER_TRADE: "0.01"
  MAX_DAILY_LOSS: "0.03"
  MAX_OPEN_POSITIONS: "4"
  LOSS_COOLDOWN_MIN: "30"

  # Heuristic pre-review gate: rule-based rejections upstream of the Claude
  # review_signal call. Catches the patterns Claude was vetoing anyway,
  # cutting review tokens roughly in half on chop days. Tune thresholds
  # against the weekly tuner's `heuristic_rejection_counts` block.
  # Phase B (2026-06-24) attribution showed both gates destroy alpha:
  # baseline backtest exp +$33/trade, heuristic gate +$10, both gates +$2.
  # Disabled in research mode while DRY_RUN=true to observe the unfiltered
  # funnel for 5 sessions. Re-enable selectively if any specific rule
  # (e.g. rel_volume floor) shows attributable edge.
  HEURISTIC_GATE_ENABLED: "false"
  # Claude review counterfactual on 13 audit sessions: approved trades
  # exp -$25/trade vs rejected +$107/trade. Reviewer was anti-selecting.
  # Disabled — manage role still runs (Claude handles open positions),
  # but every signal that survives select gets executed.
  CLAUDE_REVIEW_ENABLED: "false"
  # Rejects LONG signals from regime_direction_aware strategies (ORB)
  # whenever the regime brief returns trend_up or trend_down. Phase B
  # rerun on 7/8-7/17 audit data (209 trades) localized the alpha leak
  # to this exact subset: LONG in either trend regime lost -$52/trade
  # (trend_up) and -$124/trade (trend_down); every other regime × side
  # cell was flat or positive. Ablation on that window: +$21.17/trade
  # vs baseline +$6.47.
  #
  # Disabled 2026-08-04 after Phase B counterfactual on 7/27-8/04
  # inverted: baseline exp -$0.07/trade, gate exp -$12.63/trade (worst
  # ablation measured). The regime × side cells that lost on 7/8-7/17
  # (LONG-in-trend) were the profit leaders on 7/27-8/04 (+$27.40/trade
  # trend_down, +$10.97/trade trend_up). Static regime-side gates don't
  # generalize week-to-week; keep off until either (a) the weekly tuner
  # computes per-cell expectancy on a rolling window and gates on that,
  # or (b) the gate is redesigned as strategy-level expectancy filter.
  LONG_TREND_GATE_ENABLED: "false"
  HEURISTIC_MIN_REL_VOLUME: "0.3"
  HEURISTIC_CHOP_MIN_RR: "1.4"   # ORB rr_target=1.5; 1.4 lets ORB clear the chop floor (VWAPFade disabled 2026-06-11)
  HEURISTIC_TREND_MIN_RR: "1.4"
  # MooMoo's SIMULATE account ships with $1M of cash — way too much given
  # the target real-account size. RISK_EQUITY_OVERRIDE makes the engine
  # size against this value instead, so paper trades run at the actual
  # scale we'll go live at. Set to 0 (or remove) to use the broker's
  # reported equity. Update this BEFORE flipping MOOMOO_TRADE_ENV=REAL.
  RISK_EQUITY_OVERRIDE: "1000"

  # Equity tiers — selected once at session open against the starting equity.
  # Each tier overrides the flat RISK_PER_TRADE / MAX_DAILY_LOSS /
  # MAX_OPEN_POSITIONS and the UNIVERSE_MAX_PRICE / UNIVERSE_MIN_AVG_VOLUME
  # for that session. As the account grows, the engine self-promotes to the
  # next tier — no manual ConfigMap edits as we move from cash → margin → scale.
  #
  # NOTE: FINRA SR-2025-017 eliminated the Pattern Day Trader (PDT) rule
  # effective June 4, 2026. The $25k equity minimum and 3-day-trades-per-5-days
  # limit no longer exist. Tier boundaries are now capital-scale thresholds only.
  #
  #   cash   (<$25k):    Small-account tier. High risk% per trade to generate
  #                      meaningful dollar returns. 4 concurrent positions, sub-$100
  #                      liquid names. No PDT restriction applies.
  #   margin (<$100k):   Mid-account tier. Tighter risk%, 2 concurrent positions,
  #                      broader universe. Margin buying power available.
  #   scale  ($100k+):   Risk % scales back down, 4 concurrent positions.
  # max_notional_pct: per-tier notional cap as a fraction of equity.
  # Historic hardcoded value was 0.25 for all tiers, which contradicted
  # the cash tier's 50% risk_per_trade — at $395 equity the 25% cap =
  # $99 max notional, silently zeroing every name priced above ~$100
  # (META, AAPL, MSFT, SPY, COIN, etc.). 8/13 audit: 46 of 164 signals
  # (28%) rejected as qty_zero, all high-priced names. Aggressive tiers
  # need looser caps; scale tier keeps the historic 25%.
  EQUITY_TIERS_JSON: |
    [
      {"name":"cash",   "max_equity": 25000,  "risk_per_trade": 0.50,  "max_daily_loss": 0.20, "max_open_positions": 4, "max_price": 100,   "min_avg_volume": 5000000, "max_notional_pct": 1.5},
      {"name":"margin", "max_equity": 100000, "risk_per_trade": 0.015, "max_daily_loss": 0.04, "max_open_positions": 2, "max_price": 200,  "min_avg_volume": 2000000, "max_notional_pct": 0.5},
      {"name":"scale",  "max_equity": null,   "risk_per_trade": 0.01,  "max_daily_loss": 0.03, "max_open_positions": 4, "max_price": 1000, "min_avg_volume": 1000000, "max_notional_pct": 0.25}
    ]

  # ── Universes ──────────────────────────────────────────────────────
  # DYNAMIC_UNIVERSE=true makes the engine ignore the static lists below
  # and pull today's most-active tickers from MooMoo's get_stock_filter
  # at session open. Quality gates: price band + 10d cumulative volume
  # floor (UNIVERSE_MIN_AVG_VOLUME × 10 days). Falls back to the static
  # union on any failure path — the engine never runs without a list.
  # Local probe before flipping prod:
  #   python main.py universe --top 25 --min-avg-volume 5000000
  DYNAMIC_UNIVERSE: "true"
  UNIVERSE_TOP_N: "25"
  UNIVERSE_MIN_PRICE: "5"
  UNIVERSE_MAX_PRICE: "200"
  UNIVERSE_MIN_AVG_VOLUME: "5000000"   # 5M shares/day — drops marginals

  # Static fallback — used when DYNAMIC_UNIVERSE=false or any dynamic
  # path errors out (screener failure, OpenD reconnect mid-session, ...)
  # WATCHLIST       — breakout strategies (ORB, momentum)
  # WATCHLIST_FADE  — fade strategies (ORF) — chop-prone mid-caps only
  WATCHLIST: "SPY,QQQ,TSLA,NVDA,AMD,AAPL,MSFT,META,AMZN,GOOGL,COIN,MSTR,PLTR,SMCI,ARM"
  WATCHLIST_FADE: "RIVN,AFRM,HOOD,SOFI,U,LCID,DKNG,UPST,RBLX,CHWY"

  # ── Scheduler ──────────────────────────────────────────────────────
  # Research mode 2026-06-23 → ~2026-06-30. Live execution paused after
  # 11-day live paper run produced consistent daily losses (cumulative
  # ~-6.7%) on what looks like a real edge problem, not an execution
  # problem. Engine still ticks, generates signals, runs Claude calls,
  # writes audit log — just doesn't place orders. Flip back to "false"
  # after a backtest against the actual dynamic universe confirms (or
  # refutes) ORB edge on the names we're really trading.
  # Flipped back to false 2026-06-30 after research week. Live Phase B
  # validation begins next session. Conditions for keeping it off after
  # 5 sessions: net positive, no silent ghosts, no recurrence of the
  # claude_exit-past-stop pattern. If any of those break, set "true" and
  # investigate before re-flipping.
  # Flipped true 2026-07-20 after extended Phase B window (7/9-7/17)
  # closed -$11.14 across 63 trades. Framework clean; strategy edge is the
  # open question. Live paused while `scripts/phase_b.py` is rerun on
  # 7/8-7/17 audit data with per-side and per-regime×side splits to
  # localize the losing subset. Re-flip false once a positive-edge
  # configuration is validated in backtest AND risk_per_trade lowered
  # from 0.5 to a defensible number.
  DRY_RUN: "true"
  USE_CLAUDE: "true"
  TICK_SECONDS: "60"
  # 385 = 6h25m → EOD close runs at 15:55 ET, 5 minutes before market
  # close. With 390 (full session) the close_all_positions() call fires
  # at 16:00 ET; by the time MARKET orders are submitted (~16:01) the
  # exchange is shut and orders time out (6/18 + 6/22 silent ghosts).
  SESSION_MINUTES: "385"
  TZ: "America/New_York"

  # ── Observability ──────────────────────────────────────────────────
  METRICS_ENABLED: "true"
  METRICS_PORT: "9100"
  METRICS_ADDR: "0.0.0.0"
