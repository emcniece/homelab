apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneymaker-engine
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moneymaker
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneymaker
        app.kubernetes.io/component: engine
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # Mirror docker-compose's `depends_on: opend.service_healthy` — block
        # the engine until OpenD's API port is accepting connections.
        - name: wait-for-opend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z opend 11111; do
                echo "waiting for opend:11111..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: engine
          image: ghcr.io/emcniece/moneymaker:latest
          imagePullPolicy: Always
          command: ["python", "scheduler.py"]
          envFrom:
            - configMapRef:
                name: moneymaker-config
            - secretRef:
                name: moneymaker-secrets
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: output
              mountPath: /app/output
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f scheduler.py >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      tolerations:
        - key: "maintenance"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      # Avoid the cluster wildcard trapping external lookups
      # (api.anthropic.com, query2.finance.yahoo.com) back into lab.emc2.build.
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - name: ndots
            value: "2"
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: moneymaker-output
