apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneymaker-engine
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moneymaker
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneymaker
        app.kubernetes.io/component: engine
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        # Mirror docker-compose's `depends_on: opend.service_healthy` — block
        # the engine until OpenD's API port is accepting connections.
        - name: wait-for-opend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z opend 11111; do
                echo "waiting for opend:11111..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: engine
          image: ghcr.io/emcniece/moneymaker:latest
          imagePullPolicy: Always
          command: ["python", "scheduler.py"]
          envFrom:
            - configMapRef:
                name: moneymaker-config
            - secretRef:
                name: moneymaker-secrets
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: output
              mountPath: /app/output
            # Nested mount shadows /app/output/premarket specifically —
            # a separate RWX (csi-cephfs-sc) PVC from the RWO `output`
            # above, written by cronjob-premarket-scan.yaml. Split out
            # 2026-09-17: sharing the RWO output PVC between this
            # long-running Deployment pod and the CronJob's short-lived pod
            # caused Multi-Attach errors whenever they landed on different
            # nodes — see pvc.yaml's comment on moneymaker-premarket-scan.
            - name: premarket-scan
              mountPath: /app/output/premarket
            - name: rsa-key
              mountPath: /etc/moneymaker
              readOnly: true
          # Same HTTP probe for both: the slim base image lacks `pgrep`
          # (procps), and the metrics endpoint is the canonical liveness
          # signal — if it's serving, the scheduler thread is alive.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      tolerations:
        - key: "maintenance"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      # Avoid the cluster wildcard trapping external lookups
      # (api.anthropic.com, query2.finance.yahoo.com) back into lab.emc2.build.
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - name: ndots
            value: "2"
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: moneymaker-output
        - name: premarket-scan
          persistentVolumeClaim:
            claimName: moneymaker-premarket-scan
        - name: rsa-key
          secret:
            secretName: moneymaker-rsa-key
            # Was 0400 (owner-read only) — a latent bug, never exercised
            # because DRY_RUN=true engines never instantiate a broker (see
            # engine.py `self.broker = MoomooBroker() if not dry_run else
            # None`), so this code path has never actually run in
            # production. Found live 2026-09-17 debugging the premarket-
            # scan CronJob (which DOES call the moomoo SDK unconditionally
            # via build_universe(), dry_run or not): secret volumes are
            # owned by root, and fsGroup (1000, above) only changes GROUP
            # ownership/perms — 0400 grants zero group permissions, so a
            # non-root container can never read it regardless of fsGroup.
            # 0440 (owner+group read) is what actually lets fsGroup do its
            # job. This would have broken live trading outright the moment
            # DRY_RUN flipped to false, not just this CronJob.
            defaultMode: 0440
            # Booting before the Secret is created shouldn't crashloop —
            # the broker treats a missing key as "encryption off".
            optional: true
