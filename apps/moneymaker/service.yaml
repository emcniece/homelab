apiVersion: v1
kind: Service
metadata:
  name: moneymaker-engine
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: engine
  # Prometheus auto-discovery annotations. Picked up by kube-prometheus-stack
  # and vanilla Prometheus configs that scrape via kubernetes_sd_configs.
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: engine
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
