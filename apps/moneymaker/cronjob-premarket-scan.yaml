apiVersion: batch/v1
kind: CronJob
metadata:
  name: moneymaker-premarket-scan
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: scan
spec:
  # 08:30 ET on weekdays. k8s CronJob is timezone-aware (since v1.27).
  schedule: "30 8 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: scan
              image: ghcr.io/emcniece/moneymaker:latest
              imagePullPolicy: IfNotPresent
              # --dynamic uses build_universe() — the same source the live
              # engine would use at session boot. --out writes the ranked
              # list to the shared output PVC, where the engine's
              # load_premarket_scan() picks it up at its own boot (13:30
              # UTC) via PREMARKET_SCAN_PATH — this is what actually lets
              # DYNAMIC_UNIVERSE take effect while DRY_RUN=true, since a
              # dry_run engine has no broker to call build_universe() itself.
              command: ["python", "main.py", "scan", "--dynamic", "--top", "25",
                        "--out", "/app/output/premarket/scan-latest.json"]
              envFrom:
                - configMapRef:
                    name: moneymaker-config
                - secretRef:
                    name: moneymaker-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: output
                  mountPath: /app/output
          # Same PVC the engine Deployment mounts at /app/output. Both are
          # RWO, but local-path (the homelab default) binds a PVC to one
          # node via nodeAffinity rather than one pod — concurrent mounts
          # from pods on that same node work fine, which is the case here
          # (single-node-class cluster; see the `maintenance` toleration
          # below). If this ever moves to a multi-node cluster with a CSI
          # driver that truly enforces single-pod RWO, switch this handoff
          # to a ConfigMap written via the k8s API instead.
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: moneymaker-output
          tolerations:
            - key: "maintenance"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 60
          dnsConfig:
            nameservers: ["8.8.8.8", "1.1.1.1"]
            options:
              - name: ndots
                value: "2"
