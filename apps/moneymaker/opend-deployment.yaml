# OpenD runs in-cluster. The XML config lives in the `opend-config` Secret
# (created out-of-band; see opend-secret.yaml.example). The XML's <ip> MUST
# be 0.0.0.0 so the engine pod can reach api_port 11111 over the cluster
# network. The OpenD binary is x86_64-only — schedule on an amd64 node.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opend
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: opend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moneymaker
      app.kubernetes.io/component: opend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneymaker
        app.kubernetes.io/component: opend
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: opend
          image: ghcr.io/emcniece/moneymaker-opend:10.11.7108
          # Was IfNotPresent — this exact version tag has already been
          # overwritten twice during the OpenD 10.11 migration (same
          # staleness class as the premarket-scan CronJob fix earlier):
          # IfNotPresent only checks whether the tag string exists
          # locally, not whether its digest changed, so a node that
          # already pulled this tag once silently keeps running the old
          # content forever. Always until this version tag stops moving.
          imagePullPolicy: Always
          # Login: manual, via login-bootstrap.sh — NOT the documented
          # headless `-console=0 -login_by_remember=1` args. Tried that
          # path twice, including right after freshly re-establishing the
          # remembered session (so it wasn't stale-state): OpenD's own
          # gateway log (GTWLog_*.log) never advances past
          # ProgramStatusType_Loaded, no login attempt ever starts, no
          # error either — it just sits there. (Also hit, separately:
          # `args` alone with no explicit `command` makes k8s try to exec
          # "-console=0" directly as the binary, since the image sets CMD
          # but no ENTRYPOINT — CrashLoopBackOff, zero log output. And
          # `-console=0` alone, without `-no_monitor=1`, daemonizes and
          # the foreground process exits almost immediately — exitCode 0,
          # "Completed", not a crash, but the container still dies.) This
          # looks like a real incompatibility in this OpenD build between
          # `-console=0` and `-login_by_remember`, not an environment
          # problem — not pursued further after two attempts.
          #
          # Standing approach instead: login-bootstrap.sh, driven
          # manually from outside one prompt at a time (see its header).
          # Fully automated as of 2026-10-30 (explicit operator request —
          # "secure and trusted environment"): login-bootstrap.sh's
          # auto_login() submits account, password, and (if prompted) an
          # SMS code relayed via Pushbullet, with attempt-limit/alerting
          # guards — see that script's header for the full design. All
          # three of LOGIN_ACCOUNT/LOGIN_PWD/PUSHBULLET_ACCESS_TOKEN are
          # wired below for this; PUSHBULLET_ACCESS_TOKEN is also read by
          # the engine deployment (its websocket listener does the actual
          # SMS-reading — this container just polls the engine's relay
          # endpoint over HTTP, see login-bootstrap.sh).
          command: ["/login-bootstrap.sh"]
          env:
            - name: LOGIN_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: opend-config
                  key: LOGIN_ACCOUNT
            - name: LOGIN_PWD
              valueFrom:
                secretKeyRef:
                  name: opend-config
                  key: LOGIN_PWD
            - name: PUSHBULLET_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: PUSHBULLET_ACCESS_TOKEN
                  optional: true
          ports:
            - name: api
              containerPort: 11111
              protocol: TCP
          volumeMounts:
            - name: opend-config
              mountPath: /opend/OpenD.xml
              subPath: OpenD.xml
              readOnly: true
            - name: rsa-key
              mountPath: /opend/rsa_key.pem
              subPath: rsa_key.pem
              readOnly: true
            # OpenD writes its device fingerprint + session token here after
            # the first telnet verification. Persist it so reschedules don't
            # re-prompt. Container runs as root, so $HOME is /root.
            - name: opend-state
              mountPath: /root/.com.moomoo.OpenD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Deep check, not just "is the port open" — confirmed live
          # 2026-10-28: OpenD can accept TCP connections for over an hour
          # while rejecting every actual encrypted handshake ("check sha
          # error"), which a tcpSocket probe can't see at all, so a plain
          # port check stayed green the whole time the engine's real
          # orders were silently broken. Delegates to the engine's
          # /healthz/opend (metrics.py's _opend_health), which performs a
          # real quote+trade+unlock+account round trip and is itself
          # rate-limited/connection-reusing specifically so this probe
          # can't become another source of the same connection-storm
          # that degraded OpenD in the first place (see that function's
          # comments). curl is already in this image (Dockerfile).
          #
          # Deliberately readinessProbe only, not livenessProbe: this
          # depends on the engine pod's Service being reachable, and a
          # liveness failure restarts the container — coupling OpenD
          # restarts to a transient engine-side hiccup would be a worse
          # failure mode than the one this is meant to catch. Readiness
          # failure just pulls OpenD out of its own Service's endpoints
          # (harmless here: the engine is the only consumer, and if the
          # engine pod itself is down, nothing is trying to reach OpenD
          # anyway).
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                # 18s, not a short default: _opend_health can legitimately
                # take up to ~18s (its own 15s process-level timeout plus
                # kill/join overhead — see metrics.py). curl's old 5s
                # --max-time bailed and closed the socket long before that,
                # which doesn't fail the check cleanly — it just makes the
                # SERVER's later write to the now-closed connection throw a
                # noisy (harmless, but alarming-looking) BrokenPipeError,
                # confirmed live 2026-10-29. timeoutSeconds below must stay
                # a few seconds above curl's --max-time, or kubelet kills
                # the exec probe itself first, same mismatch one level up.
                - "curl -sf --max-time 18 http://moneymaker-engine:9100/healthz/opend"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 2
          # Cheap, local, no cross-pod dependency — basic crash/hang
          # detection only. Kept as tcpSocket deliberately (see above).
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      tolerations:
        - key: "maintenance"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      # The cluster default resolv.conf has ndots:5 + a `lab.emc2.build`
      # search domain backed by a wildcard. ndots:2 was NOT low enough —
      # confirmed live 2026-10-25: api.moomoo.com/openapi.moomoo.com (2
      # dots) resolved fine, but moomoo.com/futunn.com/futu.com (1 dot —
      # exactly the kind of short root-domain hostname an account-login
      # backend plausibly calls) all silently hijacked to the cluster's
      # own ingress IP instead of moomoo's real servers. This was the
      # actual cause of the OpenD login flow hanging indefinitely at the
      # password step — not a credentials or general network-quality
      # problem, a request going to the wrong host entirely. Same fix as
      # homelab's ARC runner work needed for bare `github.com`: ndots:1,
      # so any name with at least one dot resolves absolute first.
      # (The *.lab.emc2.build wildcard was removed 2026-10-25, so this is
      # now belt and braces; the public nameservers went with it.)
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: opend-config
          secret:
            secretName: opend-config
            items:
              - key: OpenD.xml
                path: OpenD.xml
        - name: rsa-key
          secret:
            secretName: moneymaker-rsa-key
            defaultMode: 0400
            # Same Secret the engine pod mounts. Both ends of the InitConnect
            # RSA handshake need the identical PEM file. Optional so the
            # deployment can come up while the Secret is being created — but
            # MooMoo trade calls will fail until the key is present and OpenD
            # has been restarted with <rsa_private_key> set in OpenD.xml.
            optional: true
        - name: opend-state
          persistentVolumeClaim:
            claimName: opend-state
---
apiVersion: v1
kind: Service
metadata:
  name: opend
  namespace: moneymaker
  labels:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: opend
spec:
  type: ClusterIP
  # Confirmed live 2026-10-29: the engine's wait-for-opend init
  # container does a plain `nc -z opend 11111` against this Service,
  # and a Service only routes to ready pods by default — so once the
  # deep readinessProbe above correctly started reporting opend as
  # not-ready (real moomoo connection down, not just "is the port
  # open"), the Service had zero endpoints and the engine pod got
  # stuck in Init forever, unable to even boot to report the problem.
  # publishNotReadyAddresses restores the old "the pod exists, route to
  # it" behavior for Service consumers (the init container's crude port
  # check only ever needed that much), while the pod's own readiness
  # status — visible via `kubectl get pods`, dashboards, etc. — still
  # correctly reflects the deep check. Only Service routing stops being
  # gated by it.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: moneymaker
    app.kubernetes.io/component: opend
  ports:
    - name: api
      port: 11111
      targetPort: api
      protocol: TCP
