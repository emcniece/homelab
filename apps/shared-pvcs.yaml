apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-complete
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
  storageClassName: csi-cephfs-sc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]        # CephFS specific
  resources:
    requests:
      storage: 20Ti
  storageClassName: csi-cephfs-sc       # CephFS specific
