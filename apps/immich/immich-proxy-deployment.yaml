apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-proxy
  namespace: immich
  labels:
    app: immich-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-proxy
  template:
    metadata:
      labels:
        app: immich-proxy
    spec:
      containers:
      - name: immich-proxy
        image: lscr.io/linuxserver/immich:latest
        command: ["immich"]
        args: ["start-proxy"]
        ports:
        - containerPort: 8080
        env:
        - name: PUBLIC_IMMICH_SERVER_URL
          value: "http://immich-server:3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      dnsConfig:
        # nameservers: ["8.8.8.8"]
        options:
          - name: ndots
            value: "2"
