---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: default
data:
  config.yml: |
    ---
    # Homepage configuration
    # See https://fontawesome.com/search for icons options

    title: "Demo dashboard"
    subtitle: "Homer"
    logo: "logo.png"
    # icon: "fas fa-skull-crossbones" # Optional icon

    header: true
    footer: '<p>Created with <span class="has-text-danger">❤️</span> with <a href="https://bulma.io/">bulma</a>, <a href="https://vuejs.org/">vuejs</a> & <a href="https://fontawesome.com/">font awesome</a> // Fork me on <a href="https://github.com/bastienwirtz/homer"><i class="fab fa-github-alt"></i></a></p>' # set false if you want to hide it.

    # Optional theme customization
    theme: walkxcode # 'default', 'walkxcode', or 'neon' see files in 'src/assets/themes'.

    # Optional theme customization (color overrrides)
    # overrrides can also be done using CSS vars 
    # colors:
    #   light:
    #     highlight-primary: "#3367d6"
    #     highlight-secondary: "#4285f4"
    #     highlight-hover: "#5a95f5"
    #     background: "#f5f5f5"
    #     card-background: "#ffffff"
    #     text: "#363636"
    #     text-header: "#ffffff"
    #     text-title: "#303030"
    #     text-subtitle: "#424242"
    #     card-shadow: rgba(0, 0, 0, 0.1)
    #     link: "#3273dc"
    #     link-hover: "#363636"
    #   dark:
    #     highlight-primary: "#3367d6"
    #     highlight-secondary: "#4285f4"
    #     highlight-hover: "#5a95f5"
    #     background: "#131313"
    #     card-background: "#2b2b2b"
    #     text: "#eaeaea"
    #     text-header: "#ffffff"
    #     text-title: "#fafafa"
    #     text-subtitle: "#f5f5f5"
    #     card-shadow: rgba(0, 0, 0, 0.4)
    #     link: "#3273dc"
    #     link-hover: "#ffdd57"

    # Optional message
    message:
      #url: https://b4bz.io
      style: "is-dark" # See https://bulma.io/documentation/components/message/#colors for styling options.
      title: "Demo !"
      icon: "fa fa-grin"
      content: "This is a dummy homepage demo. <br /> Find more information on <a href='https://github.com/bastienwirtz/homer'>github.com/bastienwirtz/homer</a>"

    # Optional navbar
    # links: [] # Allows for navbar (dark mode, layout, and search) without any links
    links:
      - name: "Contribute"
        icon: "fab fa-github"
        url: "https://github.com/bastienwirtz/homer"
        target: "_blank" # optional html a tag target attribute
      - name: "Wiki"
        icon: "fas fa-book"
        url: "https://www.wikipedia.org/"
      # this will link to a second homer page that will load config from additional-page.yml and keep default config values as in config.yml file
      # see url field and assets/additional-page.yml.dist used in this example:
      #- name: "another page!"
      #  icon: "fas fa-file-alt"
      #  url: "#additional-page" 

    # Services
    # First level array represent a group.
    # Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
    services:
      - name: "Media"
        icon: "fas fa-cloud"
        items:
          - name: "Jellyfin"
            type: "Emby"
            logo: "assets/tools/sample.png"
            url: https://jellyfin.lab.emc2.build
            apikey: "6e9392236c784f73bd9793d090ab4b14"
            libraryType: "movies" # Choose which stats to show. Can be one of: music, series or movies.
          - name: "Radarr"
            type: "Radarr" # "Lidarr" "Prowlarr", "Radarr" or "Sonarr"
            logo: "assets/tools/sample.png"
            url: https://radarr.lab.emc2.build
            checkInterval: 5000 # (Optional) Interval (in ms) for updating the status
            apikey: "caf0cd73bd714bf3ae534a145d305b7c"
          - name: "Sonarr"
            type: "Sonarr" # "Lidarr" "Prowlarr", "Radarr" or "Sonarr"
            logo: "assets/tools/sample.png"
            url: https://sonarr.lab.emc2.build
            checkInterval: 5000 # (Optional) Interval (in ms) for updating the status
            apikey: "bd2022395dec4bb8959b2fa6463551bd"
          - name: "Lidarr"
            type: "Lidarr" # "Lidarr" "Prowlarr", "Radarr" or "Sonarr"
            logo: "assets/tools/sample.png"
            url: https://lidarr.lab.emc2.build
            checkInterval: 5000 # (Optional) Interval (in ms) for updating the status
            apikey: "a73024a601354516b1818484ef87bf8a"
      - name: "Utilities"
        icon: "fas fa-tools"
        items:
          - name: "SABnzbd"
            type: "SABnzbd"
            logo: "assets/tools/sample.png"
            url: https://sabnzbd.lab.emc2.build
            apikey: "957eafb20e884895acfe4f40b5221f4f"
          # - name: "Deluge"
          #   type: "Deluge"
          #   logo: "assets/tools/sample.png"
          #   url: https://deluge.lab.emc2.build
          #   password: "laro4325"
          - name: "Tdarr"
            type: "Tdarr"
            logo: "assets/tools/sample.png"
            url: https://tdarr.lab.emc2.build
            #apikey: "957eafb20e884895acfe4f40b5221f4f"
      - name: "Infrastructure"
        icon: "fas fa-server"
        items:
          - name: "Proxmox PVE1"
            type: "Proxmox"
            logo: "assets/tools/sample.png"
            url: https://pve1.lab.emc2.build:8006
            node: "pve1"
            warning_value: 50
            danger_value: 80
            api_token: "PVEAPIToken=root@pam!dashboard-apps=4f967b29-4a5d-4682-9483-b80f11a52731"
            # values below this line are optional (default value are false/empty):
            hide_decimals: true # removes decimals from stats values.
            hide: [] # hides information. Possible values are "vms", "vms_total", "lxcs", "lxcs_total", "disk", "mem" and "cpu".
            small_font_on_small_screens: true # uses small font on small screens (like mobile)
            small_font_on_desktop: true # uses small font on desktops (just in case you're showing much info)
          - name: "Proxmox PVE2"
            type: "Proxmox"
            logo: "assets/tools/sample.png"
            url: https://pve1.lab.emc2.build:8006
            node: "pve2"
            warning_value: 50
            danger_value: 80
            api_token: "PVEAPIToken=root@pam!dashboard-apps=4f967b29-4a5d-4682-9483-b80f11a52731"
            # values below this line are optional (default value are false/empty):
            hide_decimals: true # removes decimals from stats values.
            hide: [] # hides information. Possible values are "vms", "vms_total", "lxcs", "lxcs_total", "disk", "mem" and "cpu".
            small_font_on_small_screens: true # uses small font on small screens (like mobile)
            small_font_on_desktop: true # uses small font on desktops (just in case you're showing much info)
