apiVersion: batch/v1
kind: Job
metadata:
  name: media-library-transfer
  namespace: media
spec:
  template:
    spec:
      containers:
      - name: rsync-transfer
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache rsync openssh-client
          
          # Create directory structure
          mkdir -p /media/tv
          mkdir -p /media/movies
          mkdir -p /media/music
          mkdir -p /media/anime
          mkdir -p /downloads
          
          # Transfer media library from media server
          echo "Starting media library transfer..."
          rsync -avz --info=progress2 root@192.168.1.100:/mnt/zpool1/apps/media-test/data/tv/ /media/tv/
          rsync -avz --info=progress2 root@192.168.1.100:/mnt/zpool1/apps/media-test/data/movies/ /media/movies/
          rsync -avz --info=progress2 root@192.168.1.100:/mnt/zpool1/apps/media-test/data/music/ /media/music/
          rsync -avz --info=progress2 root@192.168.1.100:/mnt/zpool1/apps/media-test/data/anime/ /media/anime/
          
          echo "Starting downloads transfer..."
          rsync -avz --info=progress2 root@192.168.1.100:/mnt/zpool1/apps/media-test/download/complete/ /downloads/
          
          echo "Media library transfer completed"
        volumeMounts:
        - name: media-library
          mountPath: /media
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: media-library
        persistentVolumeClaim:
          claimName: media-library
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads
      restartPolicy: Never
  backoffLimit: 1
