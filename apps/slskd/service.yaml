# Web UI + API, reached via the lab Ingress and by Aurral in-cluster
# (http://slskd.media.svc.cluster.local:5030).
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: media
  labels:
    app: slskd
spec:
  selector:
    app: slskd
  ports:
  - {name: http, port: 5030, targetPort: http, protocol: TCP}
---
# Soulseek peer port. The UDM forwards TCP 50300 from the internet to this
# fixed IP; without the forward slskd still works but finds far fewer
# sources. Only this one port is exposed.
apiVersion: v1
kind: Service
metadata:
  name: slskd-peer
  namespace: media
  labels:
    app: slskd
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.10.92
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: slskd
  ports:
  - {name: slsk, port: 50300, targetPort: slsk, protocol: TCP}
