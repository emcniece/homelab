apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    traefik.enable: 'true'
    traefik.frontend.rule: Host:jellyfin.lab.emc2.build
    traefik.port: '8096'
  labels:
    app: jellyfin
  name: jellyfin
  namespace: media
spec:
  selector:
    matchLabels:
      app: jellyfin
  # Recreate, not RollingUpdate: /config holds Jellyfin's SQLite databases on a
  # shared CephFS volume, and two pods must never have them open at once.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        traefik.enable: 'true'
        traefik.frontend.rule: Host:jellyfin.lab.emc2.build
        traefik.port: '8096'
      labels:
        app: jellyfin
    spec:
      containers:
      - env:
        - name: TZ
          value: America/Vancouver
        # - name: JELLYFIN_DATA_DIR
        #   value: /config
        image: jellyfin/jellyfin:latest
        imagePullPolicy: Always
        name: jellyfin
        ports:
        - containerPort: 8096 # Web UI HTTP
        - containerPort: 8920 # Web UI HTTPS
        - containerPort: 7359 # optional: Client discovery
          protocol: UDP
        - containerPort: 1900 # optional: Service Discovery, DLNA
          protocol: UDP
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 2Gi
            # Shared slot on k3s-07's Radeon 8060S render node (/dev/dri/renderD128)
            # for VAAPI transcoding; see infra/generic-device-plugin.
            devic.es/dri-render: 1
        volumeMounts:
        - mountPath: /config
          name: jellyfin-config
        # Same path as sabnzbd/arrs/tdarr so file paths are interchangeable
        # (libraries: /downloads/tv, /downloads/movies, /downloads/music).
        - mountPath: /downloads
          name: media-library
      #hostNetwork: true
      hostname: jellyfin
      restartPolicy: Always
      # The GPU node (k3s-07). The render node is only advertised there.
      nodeSelector:
        gpu: "true"
      tolerations:
      - key: gpu
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      dnsConfig:
        # nameservers: ["8.8.8.8"]
        options:
          - name: ndots
            value: "1"
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: media-library
        persistentVolumeClaim:
          claimName: media-library
