apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  name: handbrake
  namespace: media
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - handbrake.lab.emc2.build
    secretName: handbrake-letsencrypt-tls
  rules:
  - host: handbrake.lab.emc2.build
    http:
      paths:
      - backend:
          service:
            name: handbrake
            port:
              number: 80
        path: /
        pathType: Prefix
