apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny-influxdb
  namespace: scrutiny
  labels:
    app.kubernetes.io/name: scrutiny
    app.kubernetes.io/component: influxdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrutiny
      app.kubernetes.io/component: influxdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrutiny
        app.kubernetes.io/component: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.9
          ports:
            - containerPort: 8086
          env:
            # Left unprovisioned on purpose — the web container performs
            # first-boot setup against this instance via its
            # SCRUTINY_WEB_INFLUXDB_INIT_* env vars.
            - name: INFLUXD_USE_HASHED_TOKENS
              value: "false"
          volumeMounts:
            - mountPath: /var/lib/influxdb2
              name: influxdb-data
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 30
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: scrutiny-influxdb-data
