apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutiny-web
  namespace: scrutiny
  labels:
    app.kubernetes.io/name: scrutiny
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrutiny
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrutiny
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/starosdev/scrutiny:latest-web
          ports:
            - containerPort: 8080
          env:
            - name: SCRUTINY_WEB_INFLUXDB_HOST
              value: scrutiny-influxdb
            - name: SCRUTINY_WEB_INFLUXDB_PORT
              value: "8086"
            - name: SCRUTINY_WEB_INFLUXDB_ORG
              value: scrutiny
            - name: SCRUTINY_WEB_INFLUXDB_BUCKET
              value: metrics
            - name: SCRUTINY_WEB_INFLUXDB_INIT_USERNAME
              value: admin
            - name: SCRUTINY_WEB_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scrutiny-influxdb
                  key: INIT_PASSWORD
            - name: SCRUTINY_WEB_INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scrutiny-influxdb
                  key: TOKEN
            # Shoutrrr-style URL, e.g.
            # smtp://user:pass@host:port/?fromAddress=x&toAddresses=y
            # optional: true so this Deployment still comes up for anyone
            # who hasn't created the scrutiny-notify secret.
            - name: SCRUTINY_NOTIFY_URLS
              valueFrom:
                secretKeyRef:
                  name: scrutiny-notify
                  key: URLS
                  optional: true
          volumeMounts:
            - mountPath: /opt/scrutiny/config
              name: scrutiny-web-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: scrutiny-web-config
          persistentVolumeClaim:
            claimName: scrutiny-web-config
