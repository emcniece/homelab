apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    traefik.enable: 'true'
    traefik.frontend.rule: Host:tdarr.lab.emc2.build
    traefik.port: '8265'
  labels:
    app: tdarr
  name: tdarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdarr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        traefik.enable: 'true'
        traefik.frontend.rule: Host:tdarr.lab.emc2.build
        traefik.port: '8265'
      labels:
        app: tdarr
    spec:
      containers:
      - name: tdarr
        image: ghcr.io/haveagitgat/tdarr:2.58.02
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Vancouver
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: UMASK_SET
          value: '002'
        - name: serverIP
          value: 0.0.0.0
        - name: serverPort
          value: '8266'
        - name: webUIPort
          value: '8265'
        - name: internalNode
          value: 'false'
        - name: inContainer
          value: 'true'
        - name: ffmpegVersion
          value: '7'
        - name: nodeName
          value: TdarrServer
        - name: auth
          value: 'false'
        - name: openBrowser
          value: 'false'
        - name: maxLogSizeMB
          value: '10'
        - name: cronPluginUpdate
          value: ''
        ports:
        - containerPort: 8265
          name: webui
        - containerPort: 8266
          name: server
        resources: {}
        volumeMounts:
        - mountPath: /app/server
          name: tdarr-server
        - mountPath: /app/configs
          name: tdarr-config
        - mountPath: /app/logs
          name: tdarr-logs
        - mountPath: /media
          name: media-library
        - mountPath: /downloads
          name: downloads-complete
        - mountPath: /temp
          name: transcode-cache
        - mountPath: /staging
          name: media-staging
      hostname: tdarr
      restartPolicy: Always
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 60
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      # ndots:1 means names with 1+ dots (like github.com) are tried as absolute first, bypassing search domains
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
      - name: tdarr-server
        persistentVolumeClaim:
          claimName: tdarr-server
      - name: tdarr-config
        persistentVolumeClaim:
          claimName: tdarr-config
      - name: tdarr-logs
        persistentVolumeClaim:
          claimName: tdarr-logs
      - name: media-library
        persistentVolumeClaim:
          claimName: media-library
      - name: downloads-complete
        persistentVolumeClaim:
          claimName: downloads-complete
      - name: transcode-cache
        persistentVolumeClaim:
          claimName: transcode-cache
      - name: media-staging
        persistentVolumeClaim:
          claimName: media-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tdarr-node
  name: tdarr-node
  namespace: media
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tdarr-node
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tdarr-node
    spec:
      containers:
      - name: tdarr-node
        image: ghcr.io/haveagitgat/tdarr_node:2.58.02
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: America/Vancouver
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: UMASK_SET
          value: '002'
        - name: nodeName
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: serverIP
          value: tdarr.media.svc.cluster.local
        - name: serverPort
          value: '8266'
        - name: inContainer
          value: 'true'
        - name: ffmpegVersion
          value: '7'
        - name: nodeType
          value: worker
        - name: priority
          value: '-1'
        - name: cronPluginUpdate
          value: ''
        - name: apiKey
          value: ''
        - name: maxLogSizeMB
          value: '10'
        - name: pollInterval
          value: '2000'
        - name: startPaused
          value: 'false'
        - name: transcodegpuWorkers
          value: '0'
        - name: transcodecpuWorkers
          value: '2'
        - name: healthcheckgpuWorkers
          value: '0'
        - name: healthcheckcpuWorkers
          value: '1'
        resources: {}
        volumeMounts:
        - mountPath: /app/configs
          name: tdarr-config
        - mountPath: /app/logs
          name: tdarr-logs
        - mountPath: /media
          name: media-library
        - mountPath: /downloads
          name: downloads-complete
        - mountPath: /temp
          name: transcode-cache
        - mountPath: /staging
          name: media-staging
      restartPolicy: Always
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100 # This gives maximum preference to spreading pods across nodes
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - tdarr-node
              topologyKey: kubernetes.io/hostname # ensure pods are placed on different nodes
      # ndots:1 means names with 1+ dots (like github.com) are tried as absolute first, bypassing search domains
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      volumes:
      - name: tdarr-config
        persistentVolumeClaim:
          claimName: tdarr-config
      - name: tdarr-logs
        persistentVolumeClaim:
          claimName: tdarr-logs
      - name: media-library
        persistentVolumeClaim:
          claimName: media-library
      - name: downloads-complete
        persistentVolumeClaim:
          claimName: downloads-complete
      - name: transcode-cache
        persistentVolumeClaim:
          claimName: transcode-cache
      - name: media-staging
        persistentVolumeClaim:
          claimName: media-staging

