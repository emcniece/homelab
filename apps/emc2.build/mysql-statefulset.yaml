apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: emc2-build
  labels:
    app: mysql
spec:
  replicas: 1
  serviceName: mysql
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: database
        image: mariadb:10.11
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
        args:
          - "--ignore-db-dir=lost+found"
          - "--skip-ssl"
        envFrom:
          - secretRef:
              name: mysql-secret
        env:
          - name: MYSQL_DATABASE
            value: wordpress
          - name: MYSQL_USER
            value: wordpress
          - name: MYSQL_ALLOW_EMPTY_PASSWORD
            value: "yes"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      # WordPress follows this pod (see wordpress-deployment.yaml), so this
      # decides where the whole site lands.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          # glyphdex-ollama runs CPU inference pinned at its 6-core limit; keep
          # latency-sensitive pods off its node.
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: glyphdex
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: glyphdex
                  app.kubernetes.io/component: ollama
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      volumes:
          - name: mysql-data
            persistentVolumeClaim:
              claimName: emc2-build-mysql
