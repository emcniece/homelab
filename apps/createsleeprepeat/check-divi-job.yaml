apiVersion: batch/v1
kind: Job
metadata:
  name: check-divi-theme
  namespace: createsleeprepeat
spec:
  template:
    spec:
      containers:
      - name: check-divi
        image: instrumentisto/rsync-ssh
        command:
        - /bin/sh
        - -c
        - |
          echo "Checking for Divi theme on media server..."
          
          # Set up SSH key
          mkdir -p /root/.ssh
          cp /ssh-key/emc_sshkey.pem /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          
          # Add media server to known hosts
          ssh-keyscan -H 192.168.1.100 >> /root/.ssh/known_hosts
          
          # Check if Divi theme exists
          echo "Checking for Divi theme..."
          ssh -o StrictHostKeyChecking=no emcniece@192.168.1.100 "ls -la /home/emcniece/wp-websites/createsleeprepeat/wordpress/wp-content/themes/ | grep -i divi"
          
          echo "Listing all themes on media server..."
          ssh -o StrictHostKeyChecking=no emcniece@192.168.1.100 "ls -la /home/emcniece/wp-websites/createsleeprepeat/wordpress/wp-content/themes/"
          
          echo "Check completed!"
        volumeMounts:
        - name: ssh-key
          mountPath: /ssh-key
          readOnly: true
      volumes:
      - name: ssh-key
        secret:
          secretName: emc-ssh-key
      restartPolicy: Never
  backoffLimit: 1
