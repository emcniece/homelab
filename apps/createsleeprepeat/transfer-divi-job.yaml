apiVersion: batch/v1
kind: Job
metadata:
  name: transfer-divi-theme
  namespace: createsleeprepeat
spec:
  template:
    spec:
      containers:
      - name: rsync-transfer
        image: instrumentisto/rsync-ssh
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting Divi theme transfer..."
          
          # Set up SSH key
          mkdir -p /root/.ssh
          cp /ssh-key/emc_sshkey.pem /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          
          # Add media server to known hosts
          ssh-keyscan -H 192.168.1.100 >> /root/.ssh/known_hosts
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no emcniece@192.168.1.100 "echo 'SSH connection successful'"
          
          # Transfer Divi theme specifically
          echo "Transferring Divi theme..."
          rsync -avz --progress -e "ssh -o StrictHostKeyChecking=no" emcniece@192.168.1.100:/home/emcniece/wp-websites/createsleeprepeat/wordpress/wp-content/themes/Divi/ /wordpress/wp-content/themes/Divi/
          
          # Transfer Divi child theme
          echo "Transferring Divi child theme..."
          rsync -avz --progress -e "ssh -o StrictHostKeyChecking=no" emcniece@192.168.1.100:/home/emcniece/wp-websites/createsleeprepeat/wordpress/wp-content/themes/divi-child-theme-master/ /wordpress/wp-content/themes/divi-child-theme-master/
          
          echo "Divi theme transfer completed successfully!"
        volumeMounts:
        - name: wordpress-data
          mountPath: /wordpress
        - name: ssh-key
          mountPath: /ssh-key
          readOnly: true
      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: createsleeprepeat-wp
      - name: ssh-key
        secret:
          secretName: emc-ssh-key
      restartPolicy: Never
  backoffLimit: 3
