---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: createsleeprepeat
  annotations:
    traefik.enable: 'true'
    traefik.frontend.rule: Host:createsleeprepeat.ca
    traefik.port: '80'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          # images/wordpress: official image + phpredis.
          image: ghcr.io/emcniece/wordpress:php8.5-apache
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - containerPort: 80
              name: wordpress
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            - name: php-overrides
              mountPath: /usr/local/etc/php/conf.d/zz-overrides.ini
              subPath: zz-overrides.ini
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql-service
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WP_REDIS_HOST
              value: localhost 
            - name: WP_REDIS_PORT
              value: "6379"
        - name: redis
          image: redis:7-alpine
          # Pure cache: no persistence, and evict instead of erroring when
          # full (stays under the container memory limit).
          args:
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 6379
              name: redis    
      # Prefer the pve1 VM (k3s-04): its E5-2696 v2 runs PHP ~2x faster
      # single-threaded than the X5650 hosts (pve2/pve3) under k3s-05/06, and
      # renders here are CPU-bound (~1.5s CPU for an emc2.build page). MySQL
      # carries the same preference, which keeps the pair on one node. Only a
      # node preference: pod-affinity terms are scored by a separate plugin,
      # and the scheduler normalises each plugin to the same 0-100 range, so
      # mixing the two made "follow MySQL" tie with "pick the fast node".
      # Preferred, not required: if k3s-04 is down they run elsewhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: [pve1]
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - name: ndots
            value: "2"
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: createsleeprepeat-wp
        - name: php-overrides
          configMap:
            name: wordpress-php-overrides
---
kind: Service
apiVersion: v1
metadata:
  name: wordpress-service
  namespace: createsleeprepeat
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-http-to-https-redirect@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  creationTimestamp: null
  name: createsleeprepeat
  namespace: createsleeprepeat
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - createsleeprepeat.ca
    secretName: createsleeprepeat-ca-letsencrypt-tls
  rules:
  - host: createsleeprepeat.ca
    http:
      paths:
      - backend:
          service:
            name: wordpress-service
            port:
              number: 80
        path: /
        pathType: Prefix
