# Copy this file to 01-secret.yaml and fill in a real value, then:
#   kubectl apply -f apps/open-terminal/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public).
#
# The API key grants shell and file access inside the sandbox. Open WebUI
# needs the same value: OPEN_TERMINAL_API_KEY in apps/open-webui/01-secret.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: open-terminal-secret
  namespace: open-terminal
type: Opaque
stringData:
  # openssl rand -hex 32
  OPEN_TERMINAL_API_KEY: REPLACE_WITH_openssl_rand_hex_32
