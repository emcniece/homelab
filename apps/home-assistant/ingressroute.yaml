apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`ha.lab.emc2.build`)
    services:
    - name: home-assistant
      port: 8123
  tls:
    secretName: ha-lab-letsencrypt-tls
