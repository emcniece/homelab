apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: echoandflow
  labels:
    app: mysql
spec:
  replicas: 1
  serviceName: mysql
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: database
        image: mariadb:10.11
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
        args:
          - "--ignore-db-dir=lost+found"
          - "--skip-ssl"
        envFrom:
          - secretRef:
              name: mysql-secret
        env:
          - name: MYSQL_DATABASE
            value: wordpress
          - name: MYSQL_USER
            value: wordpress
          - name: MYSQL_ALLOW_EMPTY_PASSWORD
            value: "yes"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      # Prefer the pve1 VM (k3s-04): its E5-2696 v2 runs PHP ~2x faster
      # single-threaded than the X5650 hosts (pve2/pve3) under k3s-05/06, and
      # renders here are CPU-bound (~1.5s CPU for an emc2.build page). WordPress
      # carries the same preference, which keeps the pair on one node. Only a
      # node preference: pod-affinity terms are scored by a separate plugin,
      # and the scheduler normalises each plugin to the same 0-100 range, so
      # mixing the two made "follow MySQL" tie with "pick the fast node".
      # Preferred, not required: if k3s-04 is down they run elsewhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: [pve1]
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      volumes:
          - name: mysql-data
            persistentVolumeClaim:
              claimName: echoandflow-mysql
