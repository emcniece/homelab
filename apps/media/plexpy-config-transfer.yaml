apiVersion: batch/v1
kind: Job
metadata:
  name: plexpy-config-transfer
  namespace: media
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: transfer
        image: instrumentisto/rsync-ssh
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          
          # Create SSH key directory
          mkdir -p /root/.ssh
          
          # Copy SSH key from secret
          cp /ssh-key/emc_sshkey.pem /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          
          # Add the media server to known hosts
          ssh-keyscan -H 192.168.1.100 >> /root/.ssh/known_hosts
          
          echo "Starting PlexPy config transfer..."
          
          # Test SSH connection first
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 emcniece@192.168.1.100 "ls -la /mnt/zpool1/apps/media-test/config/plexpy/"
          
          # Transfer PlexPy config using sudo tar
          echo "Transferring PlexPy config..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 emcniece@192.168.1.100 "sudo tar -czf - -C /mnt/zpool1/apps/media-test/config/plexpy ." | tar -xzf - -C /plexpy-config/ || echo "Transfer completed with some errors"
          
          # Fix ownership and permissions
          echo "Fixing ownership and permissions..."
          chown -R 1000:1000 /plexpy-config/
          chmod -R 755 /plexpy-config/
          
          # Check what was actually transferred
          echo "Checking transferred files..."
          ls -la /plexpy-config/
          
          echo "PlexPy config transfer completed!"
        volumeMounts:
        - mountPath: /ssh-key
          name: ssh-key
          readOnly: true
        - mountPath: /plexpy-config
          name: plexpy-config
      volumes:
      - name: ssh-key
        secret:
          secretName: emc-ssh-key
      - name: plexpy-config
        persistentVolumeClaim:
          claimName: plexpy-config
