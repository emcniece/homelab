# Copy this file to 01-secret.yaml and fill in real values, then:
#   kubectl apply -f apps/pocket-id/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public).
#
# ENCRYPTION_KEY encrypts Pocket ID's signing keys at rest. If it is lost, the
# database is unusable — keep a copy somewhere safe (password manager).
---
apiVersion: v1
kind: Secret
metadata:
  name: pocket-id-secret
  namespace: pocket-id
type: Opaque
stringData:
  # openssl rand -base64 32
  ENCRYPTION_KEY: REPLACE_WITH_openssl_rand_base64_32
