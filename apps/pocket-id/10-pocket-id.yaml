apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocket-id-data
  namespace: pocket-id
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # Block storage (ext4), so SQLite is safe here — Pocket ID warns about
  # SQLite on networked filesystems like CephFS/NFS.
  storageClassName: csi-rbd-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app: pocket-id
spec:
  # SQLite: single writer.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-id
  template:
    metadata:
      labels:
        app: pocket-id
    spec:
      # The node search domain includes lab.emc2.build, which has a wildcard
      # record. With the default ndots:5, external names like
      # mail.hostedemail.com get resolved as *.lab.emc2.build first and
      # hijacked to the ingress - SMTP then times out. ndots:2 resolves
      # public names absolute first. (Same workaround as apps/outline.)
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        # The entrypoint chowns /app/data to PUID:PGID (default 1000:1000)
        # and drops privileges via su-exec.
        fsGroup: 1000
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1411
              name: http
          envFrom:
            # ENCRYPTION_KEY
            - secretRef:
                name: pocket-id-secret
          env:
            - name: APP_URL
              value: https://id.emc2.build
            # Trust X-Forwarded-* from Traefik (pod network).
            - name: TRUST_PROXY
              value: 10.42.0.0/16
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 1411
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1411
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1411
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app: pocket-id
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 1411
      name: http
  selector:
    app: pocket-id
