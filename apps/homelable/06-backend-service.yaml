apiVersion: v1
kind: Service
metadata:
  # Must be named "backend" — the frontend's nginx.conf hardcodes
  # proxy_pass http://backend:8000 and relies on in-namespace DNS.
  name: backend
  namespace: homelable
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  selector:
    app: backend
