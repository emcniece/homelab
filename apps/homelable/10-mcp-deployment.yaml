apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: homelable
  labels:
    app: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
      - name: mcp
        image: ghcr.io/pouzor/homelable-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: BACKEND_URL
          value: http://backend:8000
        envFrom:
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      tolerations:
      - key: "maintenance"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
