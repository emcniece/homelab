apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: homelable
type: Opaque
stringData:
  # openssl rand -hex 32
  SECRET_KEY: CHANGE_ME_generate_with_openssl_rand_hex_32
  # python3 -c "import bcrypt; print(bcrypt.hashpw(b'yourpassword', bcrypt.gensalt()).decode())"
  AUTH_PASSWORD_HASH: CHANGE_ME_bcrypt_hash
  MCP_API_KEY: CHANGE_ME_mcp_sk
  MCP_SERVICE_KEY: CHANGE_ME_svc_key
  # Optional: leave blank/remove if unused
  PROXMOX_TOKEN_ID: ""
  PROXMOX_TOKEN_SECRET: ""
  PROXMOX_HOST: ""
  PROXMOX_PORT: "8006"
