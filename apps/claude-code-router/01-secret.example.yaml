# Copy this file to 01-secret.yaml and fill in a real value, then:
#   kubectl apply -f apps/claude-code-router/01-secret.yaml
#
# 01-secret.yaml is gitignored (this repo is public).
#
# CCR_WEB_AUTH_TOKEN protects the management UI and RPC. Open the UI with
#   https://ccr.lab.emc2.build/?ccr_web_token=<token>
# Treat that URL like a password (browser history, proxy logs).
# Model requests use a separate CCR client key, created in the UI.
---
apiVersion: v1
kind: Secret
metadata:
  name: ccr-secret
  namespace: claude-code-router
type: Opaque
stringData:
  # openssl rand -hex 32
  CCR_WEB_AUTH_TOKEN: REPLACE_WITH_openssl_rand_hex_32
