# Copy this file to secret.yaml and fill in the real token, then:
#   kubectl apply -f apps/glyphdex/db-tunnel/secret.yaml
#
# secret.yaml is gitignored (this repo is public).
# Token: Cloudflare Zero Trust -> Networks -> Tunnels -> glyphdex-db ->
# Configure -> the long string after `--token` in the install command.
---
apiVersion: v1
kind: Secret
metadata:
  name: glyphdex-db-tunnel
  namespace: glyphdex
  labels:
    app.kubernetes.io/name: glyphdex-db-tunnel
    app.kubernetes.io/component: db-tunnel
    app.kubernetes.io/part-of: glyphdex
    app.kubernetes.io/managed-by: kubectl
  annotations:
    emc2.build/source: github.com/emcniece/homelab/apps/glyphdex/db-tunnel
type: Opaque
stringData:
  TUNNEL_TOKEN: REPLACE_WITH_TUNNEL_TOKEN
