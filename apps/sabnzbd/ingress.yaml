---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: default
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.nginx.lab.emc2.build`)
      kind: Rule
      services:
        - name: nginx
          port: 80
    - match: Host(`nginx.lab.emc2.build`)
      kind: Rule
      services:
        - name: nginx
          port: 80
      middlewares:
        - name: default-headers
  tls:
    # This must match the certificate secretName!
    #secretName: lab-emc2-build-staging-tls
    secretName: lab-emc2-build-tls
