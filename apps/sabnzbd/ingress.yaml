apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: sabnzbd
  namespace: media
spec:
  ingressClassName: traefik
  rules:
  - host: sabnzbd.lab.emc2.build
    http:
      paths:
      - backend:
          service:
            name: sabnzbd
            port:
              number: 8080
        path: /
        pathType: Prefix
