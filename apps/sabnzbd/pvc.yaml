---
# This must be created before the deployment since the storageClass is configured
# with `volumeBindingMode: WaitForFirstConsumer`
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: pv-heimdall-claim
# spec:
#   storageClassName: "proxmox-csi"
#   accessModes: ["ReadWriteOnce"]
#   resources:
#     requests:
#       storage: 10Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-sabnzbd-config
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]        # CephFS specific
  resources:
    requests:
      storage: 20Mi
  storageClassName: csi-cephfs-sc       # CephFS specific

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-transcode
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]        # CephFS specific
  resources:
    requests:
      storage: 20Gi
  storageClassName: csi-cephfs-sc       # CephFS specific
