---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: media
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`plex.lab.emc2.build`)
      kind: Rule
      services:
        - name: plex
          port: 32400
      middlewares:
        - name: default-headers
          namespace: default
  #tls: 
    # Apr 14 2025: No longer needed! Traefik serves this as the default cert
    #secretName: lab-emc2-build-tls
