# .github/workflows/wordpress-image.yaml
# Builds images/wordpress (official WordPress + phpredis) and pushes it to
# ghcr.io/emcniece/wordpress. The weekly schedule picks up upstream
# wordpress:php8.5-apache rebuilds (PHP/WordPress security fixes); the
# WordPress Deployments pull it with imagePullPolicy: Always so a pod restart
# takes the latest build.
#
# The ghcr package must be public (or the cluster given a pull secret) for
# the nodes to pull it.
name: WordPress image

on:
  push:
    branches: [main]
    paths:
      - images/wordpress/**
      - .github/workflows/wordpress-image.yaml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: images/wordpress
        platforms: linux/amd64
        pull: true
        push: true
        tags: |
          ghcr.io/emcniece/wordpress:php8.5-apache
          ghcr.io/emcniece/wordpress:php8.5-apache-${{ github.sha }}
