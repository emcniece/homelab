# Override for a second trailwave scale set dedicated to e2e.yml. Layered on
# top of runner-values-trailwave.yaml (same repo, GitHub secret, DNS fix,
# volumes and initContainers):
#
#   helm upgrade --install trailwave-runners-e2e ... \
#     -f runner-values-trailwave.yaml -f runner-values-trailwave-e2e.yaml
#
# Why a separate pool (2026-09-27): e2e runs `next build`, a PostGIS service
# container, the Next server and Playwright in one job. It took 17-23 min
# against a 30-min timeout on the 2-CPU runners, vs ~7 min on ubuntu-latest.
# Only e2e needs the bigger request; raising it for every trailwave runner
# (maxRunners 6) would ask for more CPU than the cluster has free.
#
# A 4-CPU request also steers these pods onto k3s-04 (24 cores, ~half its
# CPU unrequested): k3s-06 is ~98% requested and k3s-05 ~79%, so neither has
# 4 CPUs free. The base pool's soft topology spread was landing runners on
# k3s-06, which runs at ~84% actual CPU use.
#
# RAM-backed scratch (2026-09-27): the 4-CPU request alone barely helped
# (22m55s -> 20m34s; `next build` 279s -> 289s). k3s-04's node disk is the
# bottleneck: 61.7 MB/s sequential with fsync, ~1.6 ms per small file, and
# pnpm install, next build, setup-node and tsx all touch thousands of small
# files. So the runner's work dir (checkout, node_modules, pnpm store, tool
# cache, .next) and dind's /var/lib/docker (PostGIS image + data files) are
# tmpfs. tmpfs pages count against the writing container's memory limit,
# hence the larger memory requests/limits below. k3s-04 has 63 GiB
# allocatable and ~19 GiB requested; 2 runners x 18 GiB limits fits.
# First run: 1234s -> 803s (setup-node 180s -> 16s, pnpm install 187s ->
# 34s, PostGIS start 84s -> 38s). Peak memory: runner 4.9 GiB, dind 0.9 GiB.
#
# Helm replaces lists wholesale, so `volumes`, `containers` and
# `topologySpreadConstraints` are restated in full here. Keep them in sync
# with runner-values-trailwave.yaml apart from the tmpfs volumes, the
# docker-lib mount and `resources`.

runnerScaleSetName: trailwave-arc-runners-e2e

# One e2e job per open PR push; two lets back-to-back PRs overlap.
minRunners: 0
maxRunners: 2

template:
  spec:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            actions.github.com/scale-set-name: trailwave-arc-runners-e2e
    volumes:
      - name: work
        emptyDir:
          medium: Memory
          # Checkout + node_modules + pnpm store (hardlinked, same fs) +
          # .next + Node tool cache is ~4-5 GB.
          sizeLimit: 8Gi
      - name: docker-lib
        emptyDir:
          medium: Memory
          # PostGIS image layers + database files for the e2e service.
          sizeLimit: 5Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: pnpm-store
        persistentVolumeClaim:
          claimName: trailwave-arc-pnpm-store
      - name: playwright-cache
        persistentVolumeClaim:
          claimName: trailwave-arc-playwright-cache
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: pnpm-store
            mountPath: /mnt/pnpm-store
          - name: playwright-cache
            mountPath: /mnt/playwright-cache
        resources:
          # No cpu limit (see runner-values.yaml). Runs next build, the Next
          # server and Playwright's browsers; memory also covers the tmpfs
          # `work` volume it writes (up to 8Gi).
          requests:
            cpu: "4"
            memory: 6Gi
          limits:
            memory: 12Gi
      - name: dind
        image: docker:dind
        args:
          [
            "dockerd",
            "--host=unix:///var/run/docker.sock",
            "--group=$(DOCKER_GROUP_GID)",
            "--registry-mirror=http://glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
            "--insecure-registry=glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
          ]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: docker-lib
            mountPath: /var/lib/docker
        resources:
          # Hosts e2e.yml's PostGIS service container; memory also covers the
          # tmpfs docker-lib volume (up to 5Gi).
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 6Gi
