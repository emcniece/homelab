# gha-runner-scale-set Helm values — one release per repo/workload.
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# This release is scoped to a single repo (emcniece/Glyphdex) rather than the
# whole GitHub account/org — only that repo's workflows can target the scale
# set name below, so a workflow in an unrelated repo can't schedule work onto
# homelab hardware. See README.md for why repo-scoped, the containerMode:dind
# tradeoff, and the githubConfigSecret this depends on.

githubConfigUrl: "https://github.com/emcniece/Glyphdex"

# Referenced by name only — the Secret itself is never committed (see
# README.md "Create the GitHub credential" for the kubectl command that
# creates it directly, so the token never touches this repo or git history).
githubConfigSecret: glyphdex-arc-github-secret

# workflows reference this as `runs-on: glyphdex-arc-runners`.
runnerScaleSetName: glyphdex-arc-runners

# Scale-to-zero when idle; cap concurrent runners so a burst of pushes can't
# starve the rest of the cluster. A push to main now queues up to 8 jobs
# across ci.yml (4) + release.yml (4, meta excluded — it stayed on
# ubuntu-latest) at once. Started at 3 (2026-09-14); raised to 6 once real
# usage showed plenty of spare capacity on the untainted worker nodes
# (k3s-04 especially: 24 cores, <10% used even with 3 concurrent Docker
# builds running); raised to 8 (2026-09-14) so a full push's ci.yml +
# release.yml jobs can all run in parallel instead of any of them queuing.
minRunners: 0
maxRunners: 8

# docker/build-push-action needs a Docker daemon. This is the chart's own
# dind mode (its default `containerMode: dind` shorthand would generate the
# exact spec below) — expanded out by hand instead of using the shorthand
# because that mode generates its own fixed `volumes`/`initContainers` and
# silently ignores anything added under those same keys in `template.spec`
# (only `containers`, matched by name, actually merges) — found while adding
# the caching volumes below. The alternative build option,
# containerMode: kubernetes, needs a container-native build tool like
# buildkit-in-k8s and is more setup for no benefit at this scale.
# Requires privileged pods for the dind container (see README security note).

# The node search domain includes lab.emc2.build, which has a wildcard
# record. With the default ndots:5, short external hostnames get resolved
# as *.lab.emc2.build first and hijacked to the ingress (Traefik's cert,
# not the real host's) instead of the real internet host. ndots:1 makes any
# name with a dot resolve absolute first — ndots:2 (apps/outline's/
# apps/planka's value, which have no bare single-label-plus-TLD lookups)
# isn't low enough here: plain `github.com` (1 dot, from a bare git clone
# URL) still hit the hijack even with ndots:2; only api.github.com (2 dots)
# was fixed by it. Needed on both the listener pod (polls the Actions API)
# and the runner/dind pod (checks out + reports back).
listenerTemplate:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    containers:
      - name: listener

template:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    # docker-cache (hostPath, dind's /var/lib/docker) was tried and reverted
    # 2026-09-14 — see the "Docker layer cache: reverted" note in README.md.
    # In practice, at maxRunners:8 across only 3 untainted nodes, concurrent
    # runner pods land on the same node constantly, and containerd's boltdb
    # metadata store doesn't just fail cleanly on a second concurrent open
    # like a plain flock would — it blocks for ~15s ("waiting for response
    # from boltdb open") and then the whole dind sidecar fails to start,
    # taking the runner pod down with it. Confirmed live: most of a
    # maxRunners:8 batch failed this way. Back to the chart's default
    # ephemeral dind storage (ordinary emptyDir); the registry-based Docker
    # layer cache (`cache-from`/`cache-to: type=registry` in release.yml)
    # is the supported caching mechanism for this.
    #
    # pnpm-store: shared CephFS PVC (glyphdex-arc-pnpm-store, applied
    # separately — see README) — safe for concurrent access, unlike the
    # Docker cache above, because pnpm's content-addressable store is
    # designed for exactly this (hard-linked, its own file locking on
    # writes) rather than a single-writer daemon owning a data root.
    restartPolicy: Never
    serviceAccountName: glyphdex-arc-runners-gha-rs-no-permission
    # Spread concurrent runner pods across the 3 untainted nodes instead of
    # letting the default scheduler bin-pack them onto whichever node has the
    # most free *requested* capacity — found live 2026-09-15: a push
    # triggering both ci.yml and release.yml at once queued 8 runner pods
    # (maxRunners), and 7 of them landed on k3s-04 alone. Aggregate cluster
    # CPU wasn't over-committed on paper (dind/runner set requests, no
    # limits — see below), but real concurrent demand from 7 simultaneous
    # `pnpm install`/lint/build/docker-build processes on one 24-core node
    # was enough to visibly slow every step of the CI run (setup-node alone
    # took ~2min instead of ~10s). `preferred` (not `required`): with
    # maxRunners:8 > 3 nodes, some co-location is unavoidable once every node
    # already has a runner pod — this just makes the scheduler prefer the
    # least-loaded node first instead of ignoring spread entirely.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: actions.github.com/scale-set-name
                    operator: In
                    values: ["glyphdex-arc-runners"]
              topologyKey: kubernetes.io/hostname
    volumes:
      # dind mode's own 3 volumes (normally generated by containerMode: dind).
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: pnpm-store
        persistentVolumeClaim:
          claimName: glyphdex-arc-pnpm-store
      # Playwright's downloaded browser binaries (PLAYWRIGHT_BROWSERS_PATH) —
      # see README.md "Caching". Safe to share the same way pnpm-store is:
      # each browser version is its own immutable directory, and `playwright
      # install` skips the download entirely when it already exists.
      - name: playwright-cache
        persistentVolumeClaim:
          claimName: glyphdex-arc-playwright-cache
    # init-dind-externals: dind mode's own initContainer (copies the runner's
    # externals into the dind-externals volume the runner container reads
    # them back from). fix-pnpm-store-perms / fix-playwright-cache-perms run
    # as root only to fix ownership on their CephFS mounts before the runner
    # (non-root) container starts — a fresh/first-touch CephFS mount is
    # root-owned by default. The docker-cache mount needs no such fix: dind
    # already runs privileged/as root.
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: fix-pnpm-store-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod -R 0777 /pnpm-store"]
        volumeMounts:
          - name: pnpm-store
            mountPath: /pnpm-store
      - name: fix-playwright-cache-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod -R 0777 /playwright-cache"]
        volumeMounts:
          - name: playwright-cache
            mountPath: /playwright-cache
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: pnpm-store
            # ci.yml's node job points pnpm's store-dir here when running on
            # this scale set — see that workflow for the other half of this.
            mountPath: /mnt/pnpm-store
          - name: playwright-cache
            # ci.yml's node job points PLAYWRIGHT_BROWSERS_PATH here when
            # running on this scale set.
            mountPath: /mnt/playwright-cache
        resources:
          # No cpu *limit* — ARC's own guidance: a CPU limit throttles the
          # runner process itself (unlike a normal service pod) and tends to
          # make builds slower and flakier, not just capped, without
          # actually protecting the node. Memory limit still applies since
          # an OOM there fails cleanly (job retried) instead of degrading.
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 4Gi
      - name: dind
        image: docker:dind
        # --registry-mirror points Docker Hub pulls at the in-cluster
        # pull-through cache (registry-mirror.yaml) instead of the internet —
        # each ephemeral dind sidecar otherwise starts with a cold image
        # cache and re-pulls pgvector/pgvector, prom/prometheus, etc. from
        # scratch every run. It's a plain-HTTP service (no TLS), so it also
        # needs --insecure-registry — this is NOT the shared-data-root risk
        # documented below (that was dind's own /var/lib/docker; this is a
        # separate, single-writer proxy dind talks to over the network).
        args:
          [
            "dockerd",
            "--host=unix:///var/run/docker.sock",
            "--group=$(DOCKER_GROUP_GID)",
            "--registry-mirror=http://glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
            "--insecure-registry=glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
          ]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
        resources:
          # Previously unset entirely — the likely cause of the node job's
          # `pnpm test` DB suites timing out under concurrency (2026-09-15):
          # every testcontainers Postgres container each test file spins up
          # runs inside THIS container's dockerd, not the runner container's.
          # With no CPU/memory request, the scheduler had no basis to avoid
          # co-locating several runner pods' dind daemons tightly on the same
          # node, and no floor on how much CPU each one actually got — under
          # maxRunners: 8, container startups inside dind were observed
          # taking a uniform ~165s (suspiciously close to vitest's 180s
          # hookTimeout) across both passing and failing suites, pointing at
          # CPU starvation rather than genuine per-test work. Same
          # no-cpu-limit reasoning as the runner container above: a limit
          # throttles dockerd itself and makes container startup slower, not
          # just capped.
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 4Gi
