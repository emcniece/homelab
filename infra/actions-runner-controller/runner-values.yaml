# gha-runner-scale-set Helm values — one release per repo/workload.
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# This release is scoped to a single repo (emcniece/Glyphdex) rather than the
# whole GitHub account/org — only that repo's workflows can target the scale
# set name below, so a workflow in an unrelated repo can't schedule work onto
# homelab hardware. See README.md for why repo-scoped, the containerMode:dind
# tradeoff, and the githubConfigSecret this depends on.

githubConfigUrl: "https://github.com/emcniece/Glyphdex"

# Referenced by name only — the Secret itself is never committed (see
# README.md "Create the GitHub credential" for the kubectl command that
# creates it directly, so the token never touches this repo or git history).
githubConfigSecret: glyphdex-arc-github-secret

# workflows reference this as `runs-on: glyphdex-arc-runners`.
runnerScaleSetName: glyphdex-arc-runners

# Scale-to-zero when idle; cap concurrent runners so a burst of pushes can't
# starve the rest of the cluster. A push to main now queues up to 8 jobs
# across ci.yml (4) + release.yml (4, meta excluded — it stayed on
# ubuntu-latest) at once. Started at 3 (2026-09-14); raised to 6 once real
# usage showed plenty of spare capacity on the untainted worker nodes
# (k3s-04 especially: 24 cores, <10% used even with 3 concurrent Docker
# builds running); raised to 8 (2026-09-14) so a full push's ci.yml +
# release.yml jobs can all run in parallel instead of any of them queuing.
minRunners: 0
maxRunners: 8

# docker/build-push-action needs a Docker daemon. This is the chart's own
# dind mode (its default `containerMode: dind` shorthand would generate the
# exact spec below) — expanded out by hand instead of using the shorthand
# because that mode generates its own fixed `volumes`/`initContainers` and
# silently ignores anything added under those same keys in `template.spec`
# (only `containers`, matched by name, actually merges) — found while adding
# the caching volumes below. The alternative build option,
# containerMode: kubernetes, needs a container-native build tool like
# buildkit-in-k8s and is more setup for no benefit at this scale.
# Requires privileged pods for the dind container (see README security note).

# The node search domain includes lab.emc2.build, which has a wildcard
# record. With the default ndots:5, short external hostnames get resolved
# as *.lab.emc2.build first and hijacked to the ingress (Traefik's cert,
# not the real host's) instead of the real internet host. ndots:1 makes any
# name with a dot resolve absolute first — ndots:2 (apps/outline's/
# apps/planka's value, which have no bare single-label-plus-TLD lookups)
# isn't low enough here: plain `github.com` (1 dot, from a bare git clone
# URL) still hit the hijack even with ndots:2; only api.github.com (2 dots)
# was fixed by it. Needed on both the listener pod (polls the Actions API)
# and the runner/dind pod (checks out + reports back).
listenerTemplate:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    containers:
      - name: listener

template:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    # docker-cache: node-local hostPath (NOT a shared PVC) for the dind
    # sidecar's /var/lib/docker. Deliberately not shared across nodes —
    # two dockerd processes pointed at the same data root concurrently is
    # unsupported by Docker itself (the daemon takes an exclusive lock on
    # its data root; a second one starting against the same path fails to
    # acquire it rather than corrupting anything, but it does mean two
    # jobs landing on the *same* node at the *same* time can make one of
    # them fail on a lock conflict — a clean failure + retry, not silent
    # corruption). A CephFS-backed shared volume was considered and
    # rejected for this specific mount for the same reason, one level
    # worse (network filesystem semantics under overlay2 are explicitly
    # unsupported). Base image layers persist per-node across job runs
    # either way, which is the actual point — most jobs still land on one
    # of only 3 untainted nodes.
    # pnpm-store: shared CephFS PVC (glyphdex-arc-pnpm-store, applied
    # separately — see README) — safe for concurrent access, unlike the
    # docker cache, because pnpm's content-addressable store is designed
    # for exactly this (hard-linked, its own file locking on writes).
    restartPolicy: Never
    serviceAccountName: glyphdex-arc-runners-gha-rs-no-permission
    volumes:
      # dind mode's own 3 volumes (normally generated by containerMode: dind).
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: docker-cache
        hostPath:
          path: /var/lib/arc-docker-cache
          type: DirectoryOrCreate
      - name: pnpm-store
        persistentVolumeClaim:
          claimName: glyphdex-arc-pnpm-store
    # init-dind-externals: dind mode's own initContainer (copies the runner's
    # externals into the dind-externals volume the runner container reads
    # them back from). fix-pnpm-store-perms runs as root only to fix
    # ownership on the pnpm-store mount before the runner (non-root)
    # container starts — a fresh/first-touch CephFS mount is root-owned by
    # default. The docker-cache mount needs no such fix: dind already runs
    # privileged/as root.
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: fix-pnpm-store-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod -R 0777 /pnpm-store"]
        volumeMounts:
          - name: pnpm-store
            mountPath: /pnpm-store
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: pnpm-store
            # ci.yml's node job points pnpm's store-dir here when running on
            # this scale set — see that workflow for the other half of this.
            mountPath: /mnt/pnpm-store
        resources:
          # No cpu *limit* — ARC's own guidance: a CPU limit throttles the
          # runner process itself (unlike a normal service pod) and tends to
          # make builds slower and flakier, not just capped, without
          # actually protecting the node. Memory limit still applies since
          # an OOM there fails cleanly (job retried) instead of degrading.
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 4Gi
      - name: dind
        image: docker:dind
        args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=$(DOCKER_GROUP_GID)"]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: docker-cache
            mountPath: /var/lib/docker
