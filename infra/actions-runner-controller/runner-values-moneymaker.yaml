# gha-runner-scale-set Helm values for emcniece/moneymaker — second runner
# scale set on the same cluster/controller as runner-values.yaml
# (emcniece/Glyphdex). Same rationale (GitHub-hosted minutes are billed,
# self-hosted are free) and same repo-scoped pattern — see README.md's
# "Architecture" section for why this is a separate `helm install` rather
# than widening the Glyphdex release to the whole account.
#
# Trimmed relative to runner-values.yaml: moneymaker is a Python repo with
# no pnpm/Playwright workloads, so those volumes/initContainers are dropped.
# Still needs dind — publish-image.yml and publish-opend.yml both build and
# push Docker images.

githubConfigUrl: "https://github.com/emcniece/moneymaker"

# Referenced by name only — created directly via kubectl, never committed.
# See README.md "Point a new repo at this controller" below for the command.
githubConfigSecret: moneymaker-arc-github-secret

# workflows reference this as `runs-on: moneymaker-arc-runners`.
runnerScaleSetName: moneymaker-arc-runners

# moneymaker's heaviest concurrent case is a push to main touching opend/**:
# ci.yml (2 jobs) + publish-image.yml (1) + publish-opend.yml (1) + deploy.yml
# (1, via workflow_run once publish-image finishes) — up to 4 truly
# concurrent (deploy.yml waits on publish-image, so it doesn't overlap with
# it). Start conservative; raise if jobs are visibly queuing under
# `kubectl -n arc-runners get pods`.
minRunners: 0
maxRunners: 4

# Same ndots:1 DNS fix as runner-values.yaml — the lab.emc2.build wildcard
# hijacks short external hostnames (github.com, ghcr.io) under the default
# ndots:5/2. See that file's comment / README.md "DNS" section for the full
# story; needed on both the listener and the runner/dind pod.
listenerTemplate:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    containers:
      - name: listener

template:
  spec:
    dnsConfig:
      nameservers: ["8.8.8.8", "1.1.1.1"]
      options:
        - name: ndots
          value: "1"
    restartPolicy: Never
    serviceAccountName: moneymaker-arc-runners-gha-rs-no-permission
    # Same soft spread as Glyphdex's scale set — see runner-values.yaml's
    # comment for why ScheduleAnyway (soft) beats DoNotSchedule (hard) on
    # this cluster: k3s-05/06 are already near their CPU-request ceiling
    # from other workloads, so a hard even split stalls pods instead of
    # just running them where the room actually is.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            actions.github.com/scale-set-name: moneymaker-arc-runners
    volumes:
      # dind mode's own 3 volumes (normally generated by containerMode: dind;
      # spelled out by hand here for the same reason as runner-values.yaml —
      # containerMode: dind's shorthand silently drops anything added under
      # its auto-generated volumes/initContainers keys).
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        resources:
          # No cpu limit — throttles the runner process itself rather than
          # just capping it (ARC's own guidance; see runner-values.yaml).
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            memory: 2Gi
      - name: dind
        image: docker:dind
        # Reuses Glyphdex's registry-mirror Service (registry-mirror.yaml) —
        # it's a plain pull-through cache in arc-runners, not scoped to
        # Glyphdex specifically, so both scale sets' dind sidecars can share
        # it without any changes there.
        args:
          [
            "dockerd",
            "--host=unix:///var/run/docker.sock",
            "--group=$(DOCKER_GROUP_GID)",
            "--registry-mirror=http://glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
            "--insecure-registry=glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000",
          ]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            memory: 2Gi
