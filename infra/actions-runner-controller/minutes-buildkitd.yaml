# Persistent BuildKit daemon for minutes' image builds
# (LangfordOGSociety/minutes .github/workflows/ci.yml, job `images`): the
# web/capture image, the CPU transcriber, and the ROCm transcriber (7.7 GB,
# ~16 min cold). Buildx in the ephemeral runners' dind started cold every
# run and pulled cached layers back from GHCR before building on them
# (~65 s of the capture image's ~105 s, and all 7.7 GB whenever
# transcribe.py changed under the ROCm image). Here they stay unpacked.
#
# Same shape as belay-buildkitd.yaml (rootless, TCP :1234, Ceph RBD state,
# reachable only from this repo's runner pods), with more room: the ROCm
# image's pip layers alone are ~7 GB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minutes-buildkitd
  namespace: arc-runners
data:
  buildkitd.toml: |
    [worker.oci]
      enabled = true
      gc = true
      # Headroom inside the 80Gi state volume below.
      maxUsedSpace = "64GB"

    [worker.containerd]
      enabled = false

    [registry."docker.io"]
      mirrors = ["glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000"]

    [registry."glyphdex-arc-registry-mirror.arc-runners.svc.cluster.local:5000"]
      http = true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minutes-buildkitd-state
  namespace: arc-runners
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: csi-rbd-sc
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minutes-buildkitd
  namespace: arc-runners
  labels:
    app: minutes-buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minutes-buildkitd
  template:
    metadata:
      labels:
        app: minutes-buildkitd
      annotations:
        # Rootless BuildKit mounts inside its own user namespace, which the
        # nodes' default AppArmor profile blocks ("failed to share mount
        # point"). The annotation form: this cluster predates the field.
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      securityContext:
        fsGroup: 1000
      # Registry and GHCR lookups resolve directly (no lab.emc2.build search).
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.32.2-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # Rootless BuildKit needs this for its user namespace too.
            seccompProfile:
              type: Unconfined
          resources:
            # No CPU limit: builds are bursty. Memory: unpacking ROCm torch
            # (700 MB wheel, 4+ GB installed) in the build's own process.
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 10Gi
          volumeMounts:
            - name: state
              mountPath: /home/user/.local/share/buildkit
            - name: config
              mountPath: /home/user/.config/buildkit
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: minutes-buildkitd-state
        - name: config
          configMap:
            name: minutes-buildkitd
---
apiVersion: v1
kind: Service
metadata:
  name: minutes-buildkitd
  namespace: arc-runners
spec:
  selector:
    app: minutes-buildkitd
  ports:
    - port: 1234
      targetPort: 1234
---
# Only minutes' runner pods may use it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minutes-buildkitd
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      app: minutes-buildkitd
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              actions.github.com/scale-set-name: minutes-arc-runners
      ports:
        - port: 1234
