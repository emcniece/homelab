apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/component: exporter
    spec:
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.6.1
          args:
            - '--path.procfs=/host/proc'
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)'
            - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              # No CPU limit: throttling here delays metric encoding past
              # Prometheus's scrape_timeout, which aborts the connection
              # mid-write ("connection reset by peer" in node-exporter logs).
              memory: 50Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
          # tcpSocket, not httpGet /metrics: kubelet's httpGet probe closes
          # the connection as soon as it reads the 200 status line, while
          # node-exporter is still mid-stream writing the rest of the
          # metric families — every write after that errors ("connection
          # reset by peer"/"broken pipe"), once per remaining metric
          # family, every 10s on every node. Harmless to health, but it
          # was the dominant source of monitoring-namespace log volume.
          livenessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 30
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: rootfs
          hostPath:
            path: /
      tolerations:
        - operator: Exists
          effect: NoSchedule
