apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus-configmap.yaml
  - prometheus-serviceaccount.yaml
  - prometheus-pvc.yaml
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - prometheus-ingress.yaml
  - grafana-configmap.yaml
  - grafana-alert-rules.yaml
  - grafana-dashboard-provisioning.yaml
  - grafana-pvc.yaml
  - grafana-backup-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-ingress.yaml
  - grafana-backup-cronjob.yaml
  - node-exporter-daemonset.yaml
  - node-exporter-service.yaml
  - kube-state-metrics-serviceaccount.yaml
  - kube-state-metrics-deployment.yaml
  - kube-state-metrics-service.yaml
  - ceph-mgr-service.yaml
  - ceph-mgr-endpoints.yaml
  - loki-configmap.yaml
  - loki-pvc.yaml
  - loki-deployment.yaml
  - alloy-rbac.yaml
  - alloy-configmap.yaml
  - alloy-daemonset.yaml

configMapGenerator:
  - name: grafana-dashboards-moneymaker
    files:
      - dashboards/moneymaker/app-metrics.json
      - dashboards/moneymaker/trade-metrics.json
  - name: grafana-dashboards-logs
    files:
      - dashboards/logs/cluster-logs.json
  - name: grafana-dashboards-trailwave
    files:
      - dashboards/trailwave/trailwave-overview.json
  - name: grafana-dashboards-scrutiny
    files:
      - dashboards/scrutiny/scrutiny-overview.json

generatorOptions:
  # Pin the generated ConfigMap name (no hash suffix) so the Deployment's
  # configMap volume reference stays stable.
  disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/part-of: monitoring
  app.kubernetes.io/managed-by: kustomize
