apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: server
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: server
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: monitoring
    spec:
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://grafana.lab.emc2.build"
            # Auto-install the Infinity datasource on pod start so the
            # moneymaker trade-ledger panel can query the engine's
            # /trades JSON endpoint as a table.
            - name: GF_INSTALL_PLUGINS
              value: "yesoreyeram-infinity-datasource"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-alert-rules
              mountPath: /etc/grafana/provisioning/alerting
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards-moneymaker
              mountPath: /var/lib/grafana/dashboards/moneymaker
            - name: grafana-dashboards-logs
              mountPath: /var/lib/grafana/dashboards/logs
            - name: grafana-dashboards-trailwave
              mountPath: /var/lib/grafana/dashboards/trailwave
            - name: grafana-dashboards-scrutiny
              mountPath: /var/lib/grafana/dashboards/scrutiny
            - name: grafana-scrutiny-influxdb-token
              mountPath: /etc/secrets/scrutiny-influxdb
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # 1Gi gives headroom for file-provisioning retries on the
              # multi-source dashboard setup. 512Mi was OOMKilling every
              # ~5 min once Grafana 11's resource-manager-identity check
              # got into a retry loop on provisioned dashboards.
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 30
      # This DNS config modifies /etc/resolv.conf. Needed so that external domains can resolve outside of the cluster,
      # and not get trapped in the wildcard that leads back to lab.emc2.build.
      dnsConfig:
        # nameservers: ["8.8.8.8"]
        options:
          - name: ndots
            value: "1"
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-alert-rules
          configMap:
            name: grafana-alert-rules
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: grafana-dashboards-moneymaker
          configMap:
            name: grafana-dashboards-moneymaker
        - name: grafana-dashboards-logs
          configMap:
            name: grafana-dashboards-logs
        - name: grafana-dashboards-trailwave
          configMap:
            name: grafana-dashboards-trailwave
        - name: grafana-dashboards-scrutiny
          configMap:
            name: grafana-dashboards-scrutiny
        - name: grafana-scrutiny-influxdb-token
          secret:
            # Created out-of-band — see infra/monitoring/README.md.
            # Grafana lives in a different namespace than scrutiny-influxdb,
            # so this is a copy of that Secret's TOKEN value, not a
            # cross-namespace reference (Secrets don't cross namespaces).
            secretName: grafana-scrutiny-influxdb-token