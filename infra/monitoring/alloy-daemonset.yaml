apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/component: collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: collector
      annotations:
        # Bounce pods when the config changes
        checksum/config: "set-by-hand-if-needed"
    spec:
      serviceAccountName: alloy
      # Reading /var/log/pods and the journal needs root; Alloy doesn't
      # ship an unprivileged image variant that can do both.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - --cluster.enabled=false
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            # Host log paths
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: runjournal
              mountPath: /run/log/journal
              readOnly: true
            - name: machineid
              mountPath: /etc/machine-id
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alloy-config
        # Positions / WAL — node-local
        - name: data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: runjournal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "12345"
spec:
  type: ClusterIP
  clusterIP: None  # headless — one endpoint per node
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
  ports:
    - name: http
      port: 12345
      targetPort: http
      protocol: TCP
