apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
data:
  dashboards.yaml: |
    apiVersion: 1
    # NOTE: do NOT add a provider rooted at /var/lib/grafana/dashboards
    # itself — its recursive walk overlaps every named-provider subfolder
    # below and Grafana 11's resource manager rejects the duplicate claim
    # ("Cannot change resource manager identity"), looping every 30s and
    # OOMing the pod. Each provider must own a disjoint subtree.
    providers:
      - name: 'ceph'
        orgId: 1
        folder: 'Ceph'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/ceph
      - name: 'moneymaker'
        orgId: 1
        folder: 'Moneymaker'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/moneymaker
      - name: 'logs'
        orgId: 1
        folder: 'Logs'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/logs
      - name: 'trailwave'
        orgId: 1
        folder: 'Trailwave'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/trailwave
      - name: 'scrutiny'
        orgId: 1
        folder: 'Scrutiny'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/scrutiny
