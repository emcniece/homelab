apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-backup
    app.kubernetes.io/component: backup
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  
                  echo "Starting Grafana backup at $(date)"
                  
                  # Create backup directory with timestamp
                  BACKUP_DATE=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/grafana-backup-${BACKUP_DATE}"
                  mkdir -p "${BACKUP_DIR}"
                  
                  # Backup Grafana data directory
                  echo "Backing up Grafana data..."
                  cp -a /var/lib/grafana/. "${BACKUP_DIR}/"
                  
                  # Create a compressed archive
                  cd /backups
                  tar -czf "grafana-backup-${BACKUP_DATE}.tar.gz" "grafana-backup-${BACKUP_DATE}"
                  rm -rf "grafana-backup-${BACKUP_DATE}"
                  
                  echo "Backup completed: grafana-backup-${BACKUP_DATE}.tar.gz"
                  
                  # Keep only the last 7 daily backups
                  echo "Cleaning up old backups (keeping last 7)..."
                  ls -t /backups/grafana-backup-*.tar.gz | tail -n +8 | xargs -r rm -f
                  
                  echo "Current backups:"
                  ls -lh /backups/grafana-backup-*.tar.gz 2>/dev/null || echo "No backups found"
                  
                  echo "Backup process completed successfully at $(date)"
              volumeMounts:
                - name: grafana-storage
                  mountPath: /var/lib/grafana
                  readOnly: true
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: grafana-storage
              persistentVolumeClaim:
                claimName: grafana-storage
            - name: backup-storage
              persistentVolumeClaim:
                claimName: grafana-backup-storage
