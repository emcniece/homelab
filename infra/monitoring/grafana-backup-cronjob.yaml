apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-backup
    app.kubernetes.io/component: backup
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # grafana-storage is a ReadWriteOnce Ceph RBD volume held by the
          # grafana pod, so the backup pod must land on the same node to mount
          # it. Without this it schedules anywhere and hangs on FailedMount,
          # and concurrencyPolicy: Forbid then blocks all subsequent backups.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: grafana
                      app.kubernetes.io/component: server
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "Starting Grafana backup at $(date)"

                  BACKUP_DATE=$(date +%Y%m%d-%H%M%S)
                  NAME="grafana-backup-${BACKUP_DATE}"
                  ARCHIVE="/backups/${NAME}.tar.gz"

                  # Stage the copy on the pod's scratch volume, never on /backups, and
                  # write the archive under a .partial name until it's complete. A failed
                  # run used to leave its uncompressed staging dir in /backups, which the
                  # *.tar.gz rotation never removed; they piled up until the volume filled
                  # (2026-10-19) and every later run failed on mkdir.
                  trap 'rm -rf "/staging/${NAME}" "${ARCHIVE}.partial"' EXIT
                  rm -f /backups/*.partial

                  echo "Backing up Grafana data..."
                  mkdir -p "/staging/${NAME}"
                  cp -a /var/lib/grafana/. "/staging/${NAME}/"

                  # Same archive layout as before (single top-level ${NAME}/ dir), which
                  # grafana-restore-job.yaml expects.
                  tar -czf "${ARCHIVE}.partial" -C /staging "${NAME}"
                  mv "${ARCHIVE}.partial" "${ARCHIVE}"

                  echo "Backup completed: ${NAME}.tar.gz"
                  ls -lh "${ARCHIVE}"

                  # Keep only the last 7 daily backups
                  echo "Cleaning up old backups (keeping last 7)..."
                  ls -t /backups/grafana-backup-*.tar.gz | tail -n +8 | xargs -r rm -f

                  echo "Current backups:"
                  ls -lh /backups/grafana-backup-*.tar.gz 2>/dev/null || echo "No backups found"
                  df -h /backups | tail -1

                  echo "Backup process completed successfully at $(date)"
              volumeMounts:
                - name: grafana-storage
                  mountPath: /var/lib/grafana
                  readOnly: true
                - name: backup-storage
                  mountPath: /backups
                - name: staging
                  mountPath: /staging
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: grafana-storage
              persistentVolumeClaim:
                claimName: grafana-storage
            - name: backup-storage
              persistentVolumeClaim:
                claimName: grafana-backup-storage
            - name: staging
              emptyDir:
                sizeLimit: 2Gi
