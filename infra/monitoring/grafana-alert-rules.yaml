apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: alerting
data:
  ceph-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: Ceph Storage Alerts
        folder: Ceph
        interval: 1m
        rules:
          - uid: ceph_osd_down
            title: Ceph OSD Down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: ceph_osd_up == 0
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 2m
            annotations:
              description: "Ceph OSD {{ $labels.ceph_daemon }} on host {{ $labels.hostname }} is DOWN. This may cause data unavailability and degraded cluster performance."
              summary: "Ceph OSD Down Detected"
              runbook_url: "https://github.com/emcniece/homelab/blob/main/homelab/infra/ceph-osd-recovery.md"
            labels:
              severity: critical
              component: ceph
              alert_type: storage
            isPaused: false
          
          - uid: ceph_osd_nearly_full
            title: Ceph OSD Nearly Full
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: ceph_osd_utilization > 80
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: OK
            for: 5m
            annotations:
              description: "Ceph OSD {{ $labels.ceph_daemon }} is {{ $values.B.Value }}% full. Consider rebalancing or adding capacity."
              summary: "Ceph OSD utilization above 80%"
            labels:
              severity: warning
              component: ceph
              alert_type: storage
            isPaused: false
          
          - uid: ceph_cluster_health_warn
            title: Ceph Cluster Health Warning
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: ceph_health_status == 1
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: OK
            for: 10m
            annotations:
              description: "Ceph cluster is in HEALTH_WARN state. Check cluster status with 'ceph health detail'."
              summary: "Ceph cluster health is warning"
            labels:
              severity: warning
              component: ceph
              alert_type: storage
            isPaused: false
          
          - uid: ceph_cluster_health_err
            title: Ceph Cluster Health Error
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: ceph_health_status == 2
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 2m
            annotations:
              description: "Ceph cluster is in HEALTH_ERR state! Immediate attention required. Check cluster status with 'ceph health detail'."
              summary: "Ceph cluster health is in error state"
              runbook_url: "https://github.com/emcniece/homelab/blob/main/homelab/infra/ceph-osd-recovery.md"
            labels:
              severity: critical
              component: ceph
              alert_type: storage
            isPaused: false
  belay-alerts.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: Belay
      folder: Belay
      interval: 1m
      rules:
      - uid: belay_wal_archiving_failing
        title: Belay WAL archiving failing
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: max(cnpg_pg_stat_archiver_last_failed_time{job="belay-postgres"}) > bool max(cnpg_pg_stat_archiver_last_archived_time{job="belay-postgres"})
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - B
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Belay's Postgres can't archive WAL to B2
          description: The newest WAL archive attempt for belay-pg failed (last failure is more recent than last success). Point-in-time recovery is degraded until it's fixed. Check `kubectl -n belay logs belay-pg-1 -c postgres | grep barman`.
          runbook_url: https://github.com/emcniece/belay/blob/main/docs/RESTORE.md
        labels:
          severity: critical
          component: belay
      - uid: belay_backup_stale
        title: Belay backup older than 26h
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: time() - max(cnpg_collector_last_available_backup_timestamp{job="belay-postgres"}) > bool 93600
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - B
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 30m
        annotations:
          summary: No successful Belay base backup in 26 hours
          description: The nightly belay-pg backup (03:00 UTC) hasn't completed. Check `kubectl -n belay get backups`.
          runbook_url: https://github.com/emcniece/belay/blob/main/docs/RESTORE.md
        labels:
          severity: warning
          component: belay
      - uid: belay_app_down
        title: Belay app down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: (sum(up{job="belay"}) or vector(0)) < bool 1
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - B
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                - 0
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Prometheus can't scrape Belay
          description: No healthy belay-web pod has answered /api/metrics for 5 minutes. Check `kubectl -n belay get pods`.
          runbook_url: https://github.com/emcniece/belay/blob/main/docs/RESTORE.md
        labels:
          severity: critical
          component: belay
