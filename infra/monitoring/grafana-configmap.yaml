apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "30s"
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 1000
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        uid: infinity
        editable: false
        jsonData:
          allowedHosts:
            - "http://moneymaker-engine.moneymaker.svc.cluster.local:9100"
      - name: Scrutiny InfluxDB
        type: influxdb
        uid: scrutiny-influxdb
        access: proxy
        url: http://scrutiny-influxdb.scrutiny.svc.cluster.local:8086
        editable: false
        jsonData:
          version: Flux
          organization: scrutiny
          defaultBucket: metrics
          httpMode: POST
        secureJsonData:
          # Token is mounted from a Secret, not stored in this ConfigMap —
          # see grafana-deployment.yaml's grafana-scrutiny-influxdb-token
          # volume and infra/monitoring/README.md for how to create it.
          token: $__file{/etc/secrets/scrutiny-influxdb/token}
