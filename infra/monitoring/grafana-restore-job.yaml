apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-restore
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-restore
    app.kubernetes.io/component: restore
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-restore
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: OnFailure
      containers:
        - name: restore
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "Available backups:"
              ls -lh /backups/grafana-backup-*.tar.gz
              
              # Find the most recent backup
              LATEST_BACKUP=$(ls -t /backups/grafana-backup-*.tar.gz | head -n 1)
              
              if [ -z "$LATEST_BACKUP" ]; then
                echo "ERROR: No backup files found!"
                exit 1
              fi
              
              echo "Restoring from: $LATEST_BACKUP"
              
              # Extract backup
              cd /tmp
              tar -xzf "$LATEST_BACKUP"
              BACKUP_DIR=$(ls -d grafana-backup-* | head -n 1)
              
              # Restore to Grafana data directory
              echo "Restoring Grafana data..."
              rm -rf /var/lib/grafana/*
              cp -a /tmp/${BACKUP_DIR}/. /var/lib/grafana/
              
              # Fix permissions
              chown -R 472:472 /var/lib/grafana
              
              echo "Restore completed successfully!"
              echo "Please restart the Grafana deployment:"
              echo "  kubectl rollout restart deployment/grafana -n monitoring"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: backup-storage
              mountPath: /backups
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0  # Need root to restore and fix permissions
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: backup-storage
          persistentVolumeClaim:
            claimName: grafana-backup-storage
