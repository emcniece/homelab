# Shares the GPU on gpu=true nodes (k3s-07) between pods.
#
# The AMD device plugin (infra/amd-gpu-device-plugin) hands out the whole GPU as
# a single exclusive amd.com/gpu, which Ollama holds. Two shared resources here:
#
#   devic.es/dri-render  /dev/dri/renderD128 only: video encode/decode (VCN),
#                        e.g. Jellyfin. 4 slots.
#   devic.es/amd-gpu     /dev/kfd + /dev/dri/renderD128: ROCm compute (HIP),
#                        e.g. the minutes transcriber (WhisperX on gfx1151).
#                        2 slots. The GPU's memory is the shared GTT pool, so
#                        reserve RAM for it in the workload's memory request.
#
# Request one from a workload (no privileged mode needed in the workload; the
# device files are group render, gid 110 on k3s-07, so add that group):
#   nodeSelector: {gpu: "true"}
#   securityContext: {supplementalGroups: [110]}
#   resources:
#     limits: {devic.es/amd-gpu: 1}
#
# https://github.com/squat/generic-device-plugin  (image tag = commit f7c3291, 2026-10-26)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        gpu: "true"
        kubernetes.io/arch: amd64
      tolerations:
        - key: gpu
          operator: Exists
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:f7c3291
          args:
            - --device
            - |
              name: dri-render
              groups:
                - count: 4
                  paths:
                    - path: /dev/dri/renderD128
            - --device
            - |
              name: amd-gpu
              groups:
                - count: 2
                  paths:
                    - path: /dev/kfd
                    - path: /dev/dri/renderD128
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
