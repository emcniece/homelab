# Shares the GPU render node on gpu=true nodes (k3s-07) between pods.
#
# The AMD device plugin (infra/amd-gpu-device-plugin) hands out the whole GPU as
# a single exclusive amd.com/gpu, which Ollama holds. Video transcoding only
# needs /dev/dri/renderD128 (the VCN encode/decode engines), which is safe to
# share, so this advertises it as devic.es/dri-render with 4 slots.
#
# Request it from a workload (no privileged mode needed in the workload):
#   nodeSelector: {gpu: "true"}
#   resources:
#     limits: {devic.es/dri-render: 1}
#
# https://github.com/squat/generic-device-plugin  (image tag = commit f7c3291, 2026-10-26)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        gpu: "true"
        kubernetes.io/arch: amd64
      tolerations:
        - key: gpu
          operator: Exists
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:f7c3291
          args:
            - --device
            - |
              name: dri-render
              groups:
                - count: 4
                  paths:
                    - path: /dev/dri/renderD128
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
