# Traefik Helm values for external routing
# Using cert-manager for certificate management (not Traefik's built-in ACME)
service:
  type: LoadBalancer
  externalIPs:
    - 192.168.10.91
  ports:
    web:
      port: 80
      targetPort: web
    websecure:
      port: 443
      targetPort: websecure
    traefik:
      port: 8080
      targetPort: traefik

# Enable external routing
additionalArguments:
  - --api.dashboard=true
  - --api.insecure=true
  - --entrypoints.web.address=:80
  - --entrypoints.websecure.address=:443
  - --entrypoints.traefik.address=:8080
  - --providers.kubernetesingress.allowexternalnameservices=true
  - --providers.kubernetesingress.allowemptyservices=true
  - --providers.kubernetescrd.allowEmptyServices=true
  - --log.level=INFO
  - --accesslog=true

# Provider configuration (using Helm chart defaults with overrides)
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    allowExternalNameServices: true
    allowEmptyServices: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowEmptyServices: true

# Disable persistence - cert-manager handles certificates via Kubernetes secrets
persistence:
  enabled: false

# Disable built-in dashboard IngressRoute (using custom one)
ingressRoute:
  dashboard:
    enabled: false

# Override container ports to match entrypoints (80/443 instead of default 8000/8443)
deployment:
  initContainers: []
  containers:
    - name: traefik
      ports:
        - name: web
          containerPort: 80
        - name: websecure
          containerPort: 443
        - name: traefik
          containerPort: 8080
        - name: metrics
          containerPort: 9100

