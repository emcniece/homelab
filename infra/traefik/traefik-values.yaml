additionalArguments:
- --api.dashboard=true
- --api.insecure=true
- --providers.kubernetesingress.allowexternalnameservices=true
- --providers.kubernetesingress.allowemptyservices=true
- --providers.kubernetescrd.allowEmptyServices=true
- --log.level=INFO
- --accesslog=true
- --serversTransport.forwardingTimeouts.dialTimeout=3600s
- --serversTransport.forwardingTimeouts.responseHeaderTimeout=3600s
- --serversTransport.forwardingTimeouts.idleConnTimeout=3600s

ports:
  traefik:
    port: 8080
    expose:
      default: true
    exposedPort: 8080
    protocol: TCP
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: 3600s
        writeTimeout: 3600s
        idleTimeout: 3600s
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true
    transport:
      respondingTimeouts:
        readTimeout: 3600s
        writeTimeout: 3600s
        idleTimeout: 3600s

ingressRoute:
  dashboard:
    enabled: false

persistence:
  enabled: false

providers:
  kubernetesCRD:
    allowEmptyServices: true
    enabled: true
  kubernetesIngress:
    allowEmptyServices: true
    allowExternalNameServices: true
    enabled: true
    ingressClass: traefik
    publishedService:
      enabled: true

service:
  externalIPs:
  - 192.168.10.91
  type: LoadBalancer
  # 2026-09-12: preserve the real client IP instead of kube-proxy SNATing
  # every inbound connection to the receiving node's internal gateway
  # address. Confirmed live: Traefik's own access log showed every request
  # to every site -- real visitors and a bot flood alike -- arriving as one
  # of only two source IPs (10.42.3.1 / 10.42.5.0, the flannel gateway
  # addresses for whichever node happened to receive the packet), which made
  # the new per-source-IP WordPress rate-limit middlewares unable to
  # distinguish one visitor from another. Safe here specifically because
  # there's only a single Traefik replica (no cross-node load-balancing to
  # lose by pinning traffic to whichever node it physically arrives on).
  # Re-evaluate if Traefik is ever scaled to multiple replicas across nodes.
  # NOTE: this chart (traefik-37.1.2) only reads externalTrafficPolicy from
  # under service.spec, not as a top-level service.* key -- see
  # templates/_service.tpl's "traefik.service-spec" helper.
  spec:
    externalTrafficPolicy: Local
