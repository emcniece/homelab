# SSL Certificates for *.home.emc2.build domains
# These certificates are automatically created by cert-manager
# Apply this file to recreate SSL certificates after cluster recreation

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-emc2-build-letsencrypt-tls
  namespace: traefik-system
spec:
  secretName: home-emc2-build-letsencrypt-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - home.emc2.build
---
