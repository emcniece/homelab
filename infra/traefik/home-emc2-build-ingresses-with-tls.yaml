# Ingress resources for *.home.emc2.build domains with TLS configuration
# These ingresses route traffic from homelab cluster to media cluster
# Apply this file to recreate ingress resources after cluster recreation

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-emc2-build-routing
  namespace: default
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - home.emc2.build
    secretName: home-emc2-build-letsencrypt-tls
  rules:
  - host: "home.emc2.build"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: home-emc2-build
            port:
              number: 80
---
