# Local routing for *.home.emc2.build domains
# These ingresses route traffic to local media server applications in the media namespace

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-home-emc2-build-local-routing
  namespace: default
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - radarr.home.emc2.build
    secretName: radarr-home-emc2-build-letsencrypt-tls
  rules:
  - host: "radarr.home.emc2.build"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr-local
            port:
              number: 7878
---
