# External website routing for domains hosted on media server
apiVersion: v1
kind: Service
metadata:
  name: echoandflow-ca
  namespace: default
spec:
  type: ExternalName
  externalName: 192.168.1.100
  ports:
  - port: 80
    targetPort: 443
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: emc2-build
  namespace: default
spec:
  type: ExternalName
  externalName: 192.168.1.100
  ports:
  - port: 80
    targetPort: 443
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kamloopsdentalsociety-com
  namespace: default
spec:
  type: ExternalName
  externalName: 192.168.1.100
  ports:
  - port: 80
    targetPort: 443
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: createsleeprepeat-ca
  namespace: default
spec:
  type: ExternalName
  externalName: 192.168.1.100
