    targetPort: 443
    protocol: TCP
---
# Ingress resources for external websites
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echoandflow-ca-routing
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd,default-forward-https-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - echoandflow.ca
    secretName: echoandflow-ca-letsencrypt-tls
  rules:
  - host: "echoandflow.ca"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echoandflow-ca
            port:
              number: 80
---
